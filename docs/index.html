<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chotot Meta Ads — Creative Performance</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --line: #e6e8eb; --ink: #1a1a2e;
    --muted: #6b7280; --accent: #6d28d9; --green: #059669; --amber: #d97706; --red: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 60px; }
  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  .range-select { font-size: 13px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); cursor: pointer; margin-bottom: 6px; }
  .platform-switch { display: inline-flex; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); align-self: center; }
  .platform-switch .pf { border: none; background: transparent; padding: 9px 20px; font-size: 14px; font-weight: 700; color: var(--muted); cursor: pointer; }
  .platform-switch .pf.active { background: var(--accent); color: #fff; }
  .platform-switch .pf:not(.active):hover { background: #f3f0fd; color: var(--accent); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin: 22px 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .card .k { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .card .v { font-size: 24px; font-weight: 700; margin-top: 6px; }
  .card .v.accent { color: var(--accent); }
  .insights { background: #eff4ff; border: 1px solid #dbe4ff; border-radius: 12px; padding: 16px 20px; margin: 22px 0; }
  .insights .ins-head { font-size: 12px; font-weight: 700; letter-spacing: .04em; color: #3b5bdb; margin-bottom: 8px; }
  .insights .ins-row { padding: 8px 0; border-top: 1px solid #e0e7ff; font-size: 13px; line-height: 1.5; }
  .insights .ins-row:first-of-type { border-top: none; }
  .insights .ins-row::before { content: "→ "; color: #3b5bdb; font-weight: 700; }
  .insights .ins-row b { font-weight: 700; }
  .insights .warn::before { content: "⚠ "; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 14px; }
  .tab {
    border: 1px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 7px 14px; cursor: pointer; font-size: 13px; color: var(--muted);
  }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab .g { font-size: 10px; opacity: .7; margin-left: 6px; }
  .tab-camp { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .tab-camp.active { background: var(--accent); color: #fff; }
  .camp-note { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; font-size: 13px; line-height: 1.5; }
  .camp-sec { margin-bottom: 26px; }
  .sec-head { display: flex; align-items: baseline; gap: 10px; margin: 4px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--accent); }
  .sec-head b { font-size: 15px; }
  .sec-head span { color: var(--muted); font-size: 12px; }
  .empty { padding: 22px; text-align: center; color: var(--muted); font-size: 13px; }
  .controls { display: flex; align-items: center; gap: 8px; margin: 4px 0 14px; }
  .ctl-label { font-size: 12px; color: var(--muted); }
  .ctl { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 12px; color: var(--muted); }
  .ctl.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .pill { display: inline-block; margin-left: 8px; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; background: #ede9fe; color: var(--accent); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .panel-head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; gap: 18px; flex-wrap: wrap; align-items: baseline; }
  .panel-head b { font-size: 15px; }
  .panel-head span { color: var(--muted); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 14px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); cursor: pointer; user-select: none; }
  th.sorted::after { content: " ▾"; color: var(--accent); }
  tbody tr:hover { background: #faf9ff; }
  td.name { font-weight: 600; max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
  td.name a.post-link { color: inherit; text-decoration: none; }
  td.name a.post-link:hover { color: var(--accent); text-decoration: underline; }
  td.name a.post-link .ext { color: var(--accent); font-weight: 700; opacity: .7; }
  td.campaign { text-align: left; color: var(--muted); max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .f-green { background: #dcfce7; color: var(--green); }
  .f-amber { background: #fef3c7; color: var(--amber); }
  .f-red { background: #fee2e2; color: var(--red); }
  .delta { font-size: 10px; font-weight: 700; margin-left: 5px; white-space: nowrap; }
  .d-good { color: var(--green); }
  .d-bad { color: var(--red); }
  .d-flat { color: var(--muted); }
  .foot { color: var(--muted); font-size: 12px; margin-top: 22px; text-align: center; }
  .err { padding: 40px; text-align: center; color: var(--red); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">📊 Chotot Meta Ads — Creative Performance</h1>
      <div class="sub" id="period">…</div>
    </div>
    <div class="platform-switch" id="platform-switch">
      <button class="pf active" id="pf-meta">📊 Meta</button>
      <button class="pf" id="pf-google">🔍 Google</button>
      <button class="pf" id="pf-campaign">🎯 Campaign</button>
    </div>
    <div style="text-align:right">
      <select id="range" class="range-select"></select>
      <div class="sub" id="generated">…</div>
    </div>
  </header>

  <div class="cards" id="cards"></div>
  <div class="insights" id="insights" style="display:none"></div>
  <div class="tabs" id="tabs"></div>
  <div class="controls">
    <span class="ctl-label">View:</span>
    <button class="ctl" id="btn-creative">By creative</button>
    <button class="ctl" id="btn-format">By format</button>
    <button class="ctl" id="btn-perad">Per ad</button>
    <span style="flex:1"></span>
    <button class="ctl" id="btn-campaign">+ Campaign</button>
  </div>
  <div id="panel"></div>

  <div class="foot" id="foot"></div>
</div>

<script>
const CUR = "SGD";
const SGD_TO_VND = 20337;  // exchange rate used for the VND columns
let RAW = null, RANGES = {}, curRange = null;
let DATA = null, activeIdx = 0, sortKey = "spend", sortDir = -1, viewMode = "creative";
let showCampaign = false;  // Campaign column is collapsed by default (toggle to show)
let AB = null;  // Airbridge MMP installs snapshot (docs/data/airbridge_installs.json)
let GG = null;  // Google Ads snapshot (docs/data/google_data.json): sheet cost + Airbridge installs
let platform = "meta";  // top-level view: "meta" (default) | "google"

// --- Airbridge install override -----------------------------------------
// Installs come from the Airbridge MMP (last-click attribution), NOT Meta's
// self-reported numbers. AB.by_day = { "YYYY-MM-DD": { "<ad_id>": installs } }.
// We sum per-ad installs over each preset's date window (today-relative, so
// the number stays fresh even when Meta spend is a few days old) and overwrite
// installs + cpi + prev_installs on every creative.
const _ymd = dt => dt.toISOString().slice(0, 10);
const _addDays = (dt, n) => { const x = new Date(dt); x.setUTCDate(x.getUTCDate() + n); return x; };
const _today0 = () => { const n = new Date(); return new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())); };
const _firstOfMonth = dt => new Date(Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth(), 1));

function abWindow(key) {
  const t = _today0(), y = _addDays(t, -1);
  let s, e;
  if (key === "yesterday") { s = e = y; }
  else if (key === "last_7d") { e = y; s = _addDays(t, -7); }
  else if (key === "last_14d") { e = y; s = _addDays(t, -14); }
  else if (key === "last_30d") { e = y; s = _addDays(t, -30); }
  else if (key === "this_month") { s = _firstOfMonth(t); e = t; }
  else if (key === "last_month") { e = _addDays(_firstOfMonth(t), -1); s = _firstOfMonth(e); }
  else { s = e = t; }
  return {since: _ymd(s), until: _ymd(e)};
}

function abPrevWindow(key) {
  const t = _today0();
  if (key === "yesterday") { const d = _addDays(t, -2); return {since: _ymd(d), until: _ymd(d)}; }
  if (key === "last_7d")  return {since: _ymd(_addDays(t, -14)), until: _ymd(_addDays(t, -8))};
  if (key === "last_14d") return {since: _ymd(_addDays(t, -28)), until: _ymd(_addDays(t, -15))};
  if (key === "last_30d") return {since: _ymd(_addDays(t, -60)), until: _ymd(_addDays(t, -31))};
  if (key === "this_month") {
    const start = _firstOfMonth(t), elapsed = Math.round((t - start) / 86400000);
    const prevEnd = _addDays(start, -1), prevStart = _firstOfMonth(prevEnd);
    return {since: _ymd(prevStart), until: _ymd(_addDays(prevStart, elapsed))};
  }
  if (key === "last_month") {
    const end = _addDays(_firstOfMonth(t), -1), start = _firstOfMonth(end), prevEnd = _addDays(start, -1);
    return {since: _ymd(_firstOfMonth(prevEnd)), until: _ymd(prevEnd)};
  }
  return null;
}

// Sum Airbridge installs for one ad_id over [since, until] (dates compare lexically).
function abSum(id, since, until) {
  if (!AB || !AB.by_day) return 0;
  let s = 0;
  for (const day in AB.by_day) {
    if (day >= since && day <= until) { const v = AB.by_day[day][id]; if (v) s += v; }
  }
  return s;
}

// Overwrite installs/cpi/prev_installs on every creative in a range from Airbridge.
function applyAirbridge(key) {
  if (!AB || !AB.by_day || !RANGES[key] || RANGES[key]._abApplied) return;
  const cur = abWindow(key), prev = abPrevWindow(key);
  RANGES[key].accounts.forEach(a => a.creatives.forEach(c => {
    if (!c.id) return;
    c.installs = abSum(c.id, cur.since, cur.until);
    c.cpi = c.installs ? +(c.spend / c.installs).toFixed(2) : 0;
    if (prev) c.prev_installs = abSum(c.id, prev.since, prev.until);
  }));
  RANGES[key]._abApplied = true;
}

const fmtInt = n => n.toLocaleString("en-US");
const fmtMoney = n => CUR + " " + n.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const fmtVnd = n => "₫" + Math.round(n).toLocaleString("en-US");
const fmtVndSgd = n => fmtVnd(n * SGD_TO_VND);  // value is in SGD -> render as VND
const fmtPct = n => n.toFixed(2) + "%";
const fmtDash = f => n => (n > 0 && isFinite(n)) ? f(n) : "–";  // show "–" instead of 0

function freqBadge(f) {
  const cls = f >= 7 ? "f-red" : (f >= 3 ? "f-amber" : "f-green");
  return `<span class="badge ${cls}">${f.toFixed(2)}×</span>`;
}

function accountTotals(acc) {
  const t = {spend: 0, impressions: 0, reach: 0, clicks: 0, installs: 0};
  acc.creatives.forEach(c => { t.spend += c.spend; t.impressions += c.impressions; t.reach += c.reach; t.clicks += c.clicks; t.installs += (c.installs || 0); });
  t.ctr = t.impressions ? t.clicks / t.impressions * 100 : 0;
  t.count = acc.creatives.length;
  return t;
}

// % change of current vs previous period for CTR and CPI (null = no prior data).
function deltas(ctr, cpi, pImpr, pClicks, pSpend, pInst) {
  const pCtr = pImpr ? pClicks / pImpr * 100 : 0;
  const pCpi = pInst ? pSpend / pInst : 0;
  return {
    ctr_d: pCtr ? (ctr - pCtr) / pCtr * 100 : null,
    cpi_d: pCpi ? (cpi - pCpi) / pCpi * 100 : null,
  };
}

// Recompute rate/derived metrics from a summed bucket.
function withRates(g) {
  const cpi = g.installs ? g.spend / g.installs : 0;
  const ctr = g.impressions ? g.clicks / g.impressions * 100 : 0;
  const formats = g._formats ? [...g._formats] : [];
  const campaigns = g._campaigns ? [...g._campaigns].filter(Boolean) : [];
  const out = {
    ...g,
    campaign: campaigns.length === 1 ? campaigns[0] : (campaigns.length > 1 ? "Nhiều chiến dịch" : (g.campaign || "—")),
    ctr,
    cpc: g.clicks ? g.spend / g.clicks : 0,
    cpm: g.impressions ? g.spend / g.impressions * 1000 : 0,
    frequency: g.reach ? g.impressions / g.reach : 0,
    cpi,
    eng_rate: g.impressions ? g.engagement / g.impressions * 100 : 0,
    hook_rate: g.impressions ? (g.video_3s || 0) / g.impressions * 100 : 0,
    hold_rate: g.impressions ? (g.thruplay || 0) / g.impressions * 100 : 0,
    spend_vnd: g.spend * SGD_TO_VND,
    cpi_vnd: cpi * SGD_TO_VND,
    format: formats.length === 1 ? formats[0] : (formats.length > 1 ? "Mixed" : (g.format || "Other")),
    ...deltas(ctr, cpi, g.prev_impressions, g.prev_clicks, g.prev_spend, g.prev_installs),
  };
  delete out._formats;
  delete out._campaigns;
  return out;
}

// Merge rows that share the same key into one bucket (sums + recomputed rates).
function aggregateBy(creatives, keyFn) {
  const map = new Map();
  creatives.forEach(c => {
    const key = keyFn(c);
    const g = map.get(key) || {name: key, ads: 0, spend: 0, impressions: 0, reach: 0, clicks: 0,
      installs: 0, engagement: 0, video_3s: 0, thruplay: 0, prev_spend: 0, prev_impressions: 0, prev_clicks: 0, prev_installs: 0, post_url: "", _formats: new Set(), _campaigns: new Set()};
    if (!g.post_url && c.post_url) g.post_url = c.post_url;
    g.ads++; g.spend += c.spend; g.impressions += c.impressions; g.reach += c.reach;
    g.clicks += c.clicks; g.installs += (c.installs || 0); g.engagement += (c.engagement || 0);
    g.video_3s += (c.video_3s || 0); g.thruplay += (c.thruplay || 0);
    g.prev_spend += (c.prev_spend || 0); g.prev_impressions += (c.prev_impressions || 0);
    g.prev_clicks += (c.prev_clicks || 0); g.prev_installs += (c.prev_installs || 0);
    g._formats.add(c.format || "Other");
    g._campaigns.add(c.campaign || "");
    map.set(key, g);
  });
  return [...map.values()].map(withRates);
}

const aggregateByName = creatives => aggregateBy(creatives, c => c.name);
const aggregateByFormat = creatives => aggregateBy(creatives, c => c.format || "Other");

// Per-ad row: guarantee installs/cpi/format/engagement exist even for older data files.
function normalize(c) {
  const installs = c.installs || 0;
  const cpi = c.cpi != null ? c.cpi : (installs ? c.spend / installs : 0);
  const engagement = c.engagement || 0;
  return {...c, ads: 1, installs, cpi, engagement, format: c.format || "Other", campaign: c.campaign || "—",
    eng_rate: c.eng_rate != null ? c.eng_rate : (c.impressions ? engagement / c.impressions * 100 : 0),
    hook_rate: c.hook_rate != null ? c.hook_rate : (c.impressions ? (c.video_3s || 0) / c.impressions * 100 : 0),
    hold_rate: c.hold_rate != null ? c.hold_rate : (c.impressions ? (c.thruplay || 0) / c.impressions * 100 : 0),
    spend_vnd: c.spend * SGD_TO_VND, cpi_vnd: cpi * SGD_TO_VND,
    ...deltas(c.ctr || 0, cpi, c.prev_impressions || 0, c.prev_clicks || 0, c.prev_spend || 0, c.prev_installs || 0)};
}

function renderCards() {
  const g = {spend: 0, impressions: 0, clicks: 0, installs: 0, count: 0};
  DATA.accounts.forEach(a => { const t = accountTotals(a); g.spend += t.spend; g.impressions += t.impressions; g.clicks += t.clicks; g.installs += t.installs; g.count += t.count; });
  const avgCtr = g.impressions ? g.clicks / g.impressions * 100 : 0;
  const cpi = g.installs ? g.spend / g.installs : 0;
  const cards = [
    {k: "Total Spend", v: fmtMoney(g.spend), accent: true},
    {k: "Impressions", v: fmtInt(g.impressions)},
    {k: "Clicks", v: fmtInt(g.clicks)},
    {k: "Avg CTR", v: fmtPct(avgCtr)},
    {k: AB ? "Installs · Airbridge" : "Installs", v: g.installs ? fmtInt(g.installs) : "–"},
    {k: "Avg CPI", v: cpi ? fmtVndSgd(cpi) : "–"},
    {k: "Creatives", v: fmtInt(g.count) + " · " + DATA.accounts.length + " acc"},
  ];
  document.getElementById("cards").innerHTML = cards.map(c =>
    `<div class="card"><div class="k">${c.k}</div><div class="v ${c.accent ? "accent" : ""}">${c.v}</div></div>`
  ).join("");
}

// Auto-generated creative insights for the selected range (all accounts).
function computeInsights(accounts) {
  const all = [];
  accounts.forEach(a => a.creatives.forEach(c => all.push({...normalize(c), account: a.label})));
  if (!all.length) return [];

  const sum = k => all.reduce((s, c) => s + (c[k] || 0), 0);
  const spend = sum("spend"), installs = sum("installs"), impr = sum("impressions"), clicks = sum("clicks");
  const ctr = impr ? clicks / impr * 100 : 0;
  const cpi = installs ? spend / installs : 0;
  const out = [];

  // 1) Overview
  out.push(`<b>${fmtInt(all.length)}</b> creatives across <b>${accounts.length}</b> accounts · Spend <b>${fmtMoney(spend)}</b>`
    + (installs ? ` · <b>${fmtInt(installs)}</b> installs @ CPI ${fmtVndSgd(cpi)}` : "")
    + ` · Avg CTR ${fmtPct(ctr)}.`);

  // 2) Format that captures the most spend
  const fmt = aggregateByFormat(all).sort((a, b) => b.spend - a.spend);
  if (fmt.length) {
    const lead = fmt[0];
    out.push(`Top format by spend: <b>${lead.name}</b> — ${fmtMoney(lead.spend)} `
      + `(${spend ? Math.round(lead.spend / spend * 100) : 0}% of spend, ${lead.ads} ads, CTR ${fmtPct(lead.ctr)}`
      + (lead.installs ? `, CPI ${fmtVndSgd(lead.cpi)}` : "") + ").");
  }

  // 3) Most efficient format by CPI (only when installs exist to compare)
  const withInst = fmt.filter(f => f.installs > 0);
  if (withInst.length > 1) {
    const best = withInst.slice().sort((a, b) => a.cpi - b.cpi)[0];
    out.push(`Most efficient format: <b>${best.name}</b> at CPI ${fmtVndSgd(best.cpi)} on ${fmtInt(best.installs)} installs.`);
  }

  // 4) Highest-spend creative
  const topSpend = all.slice().sort((a, b) => b.spend - a.spend)[0];
  out.push(`Highest-spend creative: <b>${topSpend.name}</b> (${topSpend.account}) — ${fmtMoney(topSpend.spend)}, CTR ${fmtPct(topSpend.ctr)}`
    + (topSpend.installs ? `, CPI ${fmtVndSgd(topSpend.cpi)}` : "") + ".");

  // 5) Best CPI creative (min 5 installs to avoid noise)
  const cand = all.filter(c => c.installs >= 5);
  if (cand.length) {
    const bestCpi = cand.slice().sort((a, b) => a.cpi - b.cpi)[0];
    out.push(`Best CPI: <b>${bestCpi.name}</b> (${bestCpi.account}) — CPI ${fmtVndSgd(bestCpi.cpi)} on ${fmtInt(bestCpi.installs)} installs.`);
  }

  // 6) Frequency fatigue watch
  const fatig = all.filter(c => c.frequency >= 7);
  if (fatig.length) {
    const worst = fatig.slice().sort((a, b) => b.frequency - a.frequency)[0];
    out.push({warn: true, html: `Frequency watch: <b>${fatig.length}</b> creatives at ≥7× `
      + `(highest ${worst.frequency.toFixed(1)}× — ${worst.name}, ${worst.account}). Consider refreshing the creative.`});
  }

  return out;
}

function renderInsights() {
  const box = document.getElementById("insights");
  const rows = computeInsights(DATA.accounts);
  if (!rows.length) { box.style.display = "none"; return; }
  const period = (RANGES[curRange] && RANGES[curRange].period_label) || "";
  box.style.display = "";
  box.innerHTML = `<div class="ins-head">💡 KEY INSIGHTS${period ? " — " + period.toUpperCase() : ""}</div>`
    + rows.map(r => typeof r === "string"
        ? `<div class="ins-row">${r}</div>`
        : `<div class="ins-row warn">${r.html}</div>`).join("");
}

// Per-account insights, tailored to the team's objective:
//   GROWTH accounts run app installs -> CPI is the headline metric.
//   BRAND  accounts run awareness    -> Hook / CTR / ER are the headline metrics.
function computeAccountInsights(acc) {
  const all = acc.creatives.map(normalize);
  if (!all.length) return [];
  const brand = (acc.group || "").toUpperCase() === "BRAND";
  const sum = k => all.reduce((s, c) => s + (c[k] || 0), 0);
  const spend = sum("spend"), installs = sum("installs"), impr = sum("impressions"),
        clicks = sum("clicks"), eng = sum("engagement"), v3 = sum("video_3s");
  const ctr = impr ? clicks / impr * 100 : 0;
  const cpi = installs ? spend / installs : 0;
  const er = impr ? eng / impr * 100 : 0;
  const d = deltas(ctr, cpi, sum("prev_impressions"), sum("prev_clicks"), sum("prev_spend"), sum("prev_installs"));
  const out = [];

  if (brand) {
    // --- BRAND: Hook / CTR / ER ---
    const vid = aggregateByFormat(acc.creatives).find(f => f.name === "Video");
    out.push(`<b>${all.length}</b> creatives · Spend <b>${fmtMoney(spend)}</b> · CTR <b>${fmtPct(ctr)}</b>${deltaBadge(d.ctr_d, false)}`
      + ` · ER <b>${fmtPct(er)}</b>` + (vid && vid.hook_rate ? ` · Hook <b>${fmtPct(vid.hook_rate)}</b> (video)` : "") + ".");

    const vids = all.filter(c => c.format === "Video" && c.impressions >= 500 && c.hook_rate > 0);
    if (vids.length) {
      const bh = vids.slice().sort((a, b) => b.hook_rate - a.hook_rate)[0];
      out.push(`Best hook: <b>${bh.name}</b> — Hook ${fmtPct(bh.hook_rate)}, Hold ${fmtPct(bh.hold_rate)} on ${fmtInt(bh.impressions)} impr.`);
    }
    const cc = all.filter(c => c.impressions >= 500);
    if (cc.length) {
      const bc = cc.slice().sort((a, b) => b.ctr - a.ctr)[0];
      out.push(`Best CTR: <b>${bc.name}</b> — ${fmtPct(bc.ctr)} (${fmtInt(bc.clicks)} clicks, spend ${fmtMoney(bc.spend)}).`);
      const be = cc.slice().sort((a, b) => b.eng_rate - a.eng_rate)[0];
      out.push(`Best engagement rate: <b>${be.name}</b> — ER ${fmtPct(be.eng_rate)} (${fmtInt(be.engagement)} post eng.).`);
    }
  } else {
    // --- GROWTH: CPI ---
    out.push(`<b>${all.length}</b> creatives · Spend <b>${fmtMoney(spend)}</b>`
      + (installs ? ` · <b>${fmtInt(installs)}</b> installs @ CPI <b>${fmtVndSgd(cpi)}</b>${deltaBadge(d.cpi_d, true)}` : " · no installs tracked")
      + ` · CTR ${fmtPct(ctr)}${deltaBadge(d.ctr_d, false)}.`);

    const cand = all.filter(c => c.installs >= 5);
    if (cand.length) {
      const best = cand.slice().sort((a, b) => a.cpi - b.cpi)[0];
      out.push(`Best CPI: <b>${best.name}</b> — ${fmtVndSgd(best.cpi)} on ${fmtInt(best.installs)} installs (CTR ${fmtPct(best.ctr)}).`);
      const worst = cand.slice().sort((a, b) => b.cpi - a.cpi)[0];
      if (worst !== best) {
        out.push({warn: true, html: `Worst CPI: <b>${worst.name}</b> — ${fmtVndSgd(worst.cpi)} on ${fmtInt(worst.installs)} installs, spend ${fmtMoney(worst.spend)}. Consider optimizing/pausing.`});
      }
    }
    const ts = all.slice().sort((a, b) => b.spend - a.spend)[0];
    out.push(`Highest spend: <b>${ts.name}</b> — ${fmtMoney(ts.spend)}`
      + (ts.installs ? `, CPI ${fmtVndSgd(ts.cpi)}` : "") + `, CTR ${fmtPct(ts.ctr)}.`);
  }

  // Frequency fatigue watch (both objectives).
  const fat = all.filter(c => c.frequency >= 7);
  if (fat.length) {
    const w = fat.slice().sort((a, b) => b.frequency - a.frequency)[0];
    out.push({warn: true, html: `Frequency watch: <b>${fat.length}</b> creatives at ≥7× (highest ${w.frequency.toFixed(1)}× — ${w.name}). Consider refreshing.`});
  }
  return out;
}

  "impressions", "clicks", "ctr", "cpc", "cpm", "engagement", "eng_rate",

function colsFor(acc) {

// Build one <table>. When sortable, headers wire to sortBy and highlight sortKey.
function tableHTML(rows, cols, sortable) {
  const head = cols.map(c =>
    `<th class="${sortable && c.k === sortKey ? "sorted" : ""}"${sortable ? ` onclick="sortBy('${c.k}')"` : ""}>${c.label}</th>`
  ).join("");
  const body = rows.map(r => "<tr>" + cols.map(c => {
    if (c.k === "name") {
      const tag = r.ads > 1 ? `<span class="pill">×${r.ads} ads</span>` : "";
      // Linkify the creative name to its FB post (skip the "Format" first column).
      const nm = (c.label !== "Format" && r.post_url)
        ? `<a class="post-link" href="${r.post_url}" target="_blank" rel="noopener" title="Xem post trên Facebook: ${r.name}">${r.name} <span class="ext">↗</span></a>`
        : r.name;
      return `<td class="name" title="${r.name}">${nm}${tag}</td>`;
    }
    if (c.k === "campaign") {
      const cp = r.campaign || "—";
      return `<td class="campaign" title="${cp}">${cp}</td>`;
    }
    const val = c.f ? c.f(r[c.k]) : r[c.k];
    const badge = c.d ? deltaBadge(r[c.d], c.goodDown) : "";
    return `<td>${val}${badge}</td>`;
  }).join("") + "</tr>").join("");
  return `<div style="overflow-x:auto"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

// Small ▲/▼ % change badge vs previous period. goodDown=true means a drop is good (e.g. CPI).
function deltaBadge(pct, goodDown) {
  if (pct == null || !isFinite(pct)) return "";
  const up = pct >= 0;
  const good = goodDown ? !up : up;
  const cls = Math.abs(pct) < 0.5 ? "d-flat" : (good ? "d-good" : "d-bad");
  return ` <span class="delta ${cls}" title="vs previous period">${up ? "▲" : "▼"}${Math.abs(pct).toFixed(0)}%</span>`;
}

// ========================================================================
// GOOGLE ADS view. Data = docs/data/google_data.json (cost/impr/clicks from a
// team Google Sheet, installs from Airbridge Channel='google.adwords'). Native
// VND (no SGD conversion). Level = campaign -> ad group: each row is one ad
// group within one campaign. Sums each preset's today-relative window with the
// SAME abWindow() logic as the Airbridge Meta override, so windows line up.
// ========================================================================
const GCOLS = [
  {k: "campaign", label: "Campaign"},
  {k: "name", label: "Ad group"},
  {k: "spend", label: "Spend (₫)", f: fmtVnd},
  {k: "installs", label: "Installs", f: fmtDash(fmtInt)},
  {k: "cpi", label: "CPI (₫)", f: fmtDash(fmtVnd)},
  {k: "impressions", label: "Impr.", f: fmtInt},
  {k: "clicks", label: "Clicks", f: fmtInt},
  {k: "ctr", label: "CTR", f: fmtPct},
  {k: "cpc", label: "CPC (₫)", f: fmtDash(fmtVnd)},
  {k: "cpm", label: "CPM (₫)", f: fmtDash(fmtVnd)},
];

// Sum google_data.by_day over the window for `key`, grouped by account.
// Returns Map<account, ad-group-row[]>.
function ggWindow(key) {
  const {since, until} = abWindow(key);
  const agg = new Map();  // cid_agid -> [cost, impr, clicks, installs]
  for (const day in GG.by_day) {
    if (day < since || day > until) continue;
    const m = GG.by_day[day];
    for (const k in m) {
      const v = m[k], t = agg.get(k) || [0, 0, 0, 0];
      t[0] += v[0]; t[1] += v[1]; t[2] += v[2]; t[3] += v[3];
      agg.set(k, t);
    }
  }
  const byAcct = new Map();
  agg.forEach((v, k) => {
    const d = GG.dims[k]; if (!d) return;
    const [cost, impr, clk, ins] = v;
    if (!(cost || impr || clk || ins)) return;
    const row = {
      name: d.ag || "—", campaign: d.camp || "—", ads: 1,
      spend: cost, impressions: impr, clicks: clk, installs: ins,
      ctr: impr ? clk / impr * 100 : 0,
      cpc: clk ? cost / clk : 0,
      cpm: impr ? cost / impr * 1000 : 0,
      cpi: ins ? cost / ins : 0,
    };
    if (!byAcct.has(d.acct)) byAcct.set(d.acct, []);
    byAcct.get(d.acct).push(row);
  });
  return byAcct;
}

function ggTotals(creatives) {
  const t = {spend: 0, impressions: 0, clicks: 0, installs: 0};
  creatives.forEach(c => { t.spend += c.spend; t.impressions += c.impressions; t.clicks += c.clicks; t.installs += c.installs; });
  t.ctr = t.impressions ? t.clicks / t.impressions * 100 : 0;
  t.cpi = t.installs ? t.spend / t.installs : 0;
  t.count = creatives.length;
  return t;
}

function renderGoogleCards() {
  const g = {spend: 0, impressions: 0, clicks: 0, installs: 0, count: 0};
  DATA.accounts.forEach(a => { const t = ggTotals(a.creatives); g.spend += t.spend; g.impressions += t.impressions; g.clicks += t.clicks; g.installs += t.installs; g.count += t.count; });
  const avgCtr = g.impressions ? g.clicks / g.impressions * 100 : 0;
  const cpi = g.installs ? g.spend / g.installs : 0;
  const cards = [
    {k: "Total Spend", v: fmtVnd(g.spend), accent: true},
    {k: "Impressions", v: fmtInt(g.impressions)},
    {k: "Clicks", v: fmtInt(g.clicks)},
    {k: "Avg CTR", v: fmtPct(avgCtr)},
    {k: "Installs · Airbridge", v: g.installs ? fmtInt(g.installs) : "–"},
    {k: "Avg CPI", v: cpi ? fmtVnd(cpi) : "–"},
    {k: "Ad groups", v: fmtInt(g.count) + " · " + DATA.accounts.length + " acc"},
  ];
  document.getElementById("cards").innerHTML = cards.map(c =>
    `<div class="card"><div class="k">${c.k}</div><div class="v ${c.accent ? "accent" : ""}">${c.v}</div></div>`
  ).join("");
}

function computeGoogleInsights() {
  const all = [];
  DATA.accounts.forEach(a => a.creatives.forEach(c => all.push({...c, account: a.label})));
  if (!all.length) return [];
  const sum = k => all.reduce((s, c) => s + (c[k] || 0), 0);
  const spend = sum("spend"), installs = sum("installs"), impr = sum("impressions"), clicks = sum("clicks");
  const ctr = impr ? clicks / impr * 100 : 0, cpi = installs ? spend / installs : 0;
  const out = [];
  out.push(`<b>${fmtInt(all.length)}</b> ad groups across <b>${DATA.accounts.length}</b> accounts · Spend <b>${fmtVnd(spend)}</b>`
    + (installs ? ` · <b>${fmtInt(installs)}</b> installs @ CPI ${fmtVnd(cpi)}` : "") + ` · Avg CTR ${fmtPct(ctr)}.`);
  // Top account by spend
  const accs = DATA.accounts.map(a => ({label: a.label, ...ggTotals(a.creatives)})).sort((x, y) => y.spend - x.spend);
  if (accs.length) {
    const lead = accs[0];
    out.push(`Top account by spend: <b>${lead.label}</b> — ${fmtVnd(lead.spend)} `
      + `(${spend ? Math.round(lead.spend / spend * 100) : 0}% of spend`
      + (lead.installs ? `, ${fmtInt(lead.installs)} installs @ CPI ${fmtVnd(lead.cpi)}` : "") + ").");
  }
  // Best / worst CPI ad group (min 20 installs to avoid noise)
  const cand = all.filter(c => c.installs >= 20);
  if (cand.length) {
    const best = cand.slice().sort((a, b) => a.cpi - b.cpi)[0];
    out.push(`Best CPI: <b>${best.name}</b> (${best.account} · ${best.campaign}) — ${fmtVnd(best.cpi)} on ${fmtInt(best.installs)} installs.`);
    const worst = cand.slice().sort((a, b) => b.cpi - a.cpi)[0];
    if (worst !== best) out.push({warn: true, html: `Worst CPI: <b>${worst.name}</b> (${worst.account} · ${worst.campaign}) — ${fmtVnd(worst.cpi)} on ${fmtInt(worst.installs)} installs, spend ${fmtVnd(worst.spend)}.`});
  }
  return out;
}

function renderGoogleInsights() {
  const box = document.getElementById("insights");
  const rows = computeGoogleInsights();
  if (!rows.length) { box.style.display = "none"; return; }
  const period = (RANGES[curRange] && RANGES[curRange].period_label) || "";
  box.style.display = "";
  box.innerHTML = `<div class="ins-head">💡 KEY INSIGHTS · GOOGLE ADS${period ? " — " + period.toUpperCase() : ""}</div>`
    + rows.map(r => typeof r === "string" ? `<div class="ins-row">${r}</div>` : `<div class="ins-row warn">${r.html}</div>`).join("");
}

// Per-account insights for a Google account (CPI focus — these are install/DAU buys).
function computeGoogleAccountInsights(acc) {
  const all = acc.creatives;
  if (!all.length) return [];
  const t = ggTotals(all);
  const out = [];
  out.push(`<b>${all.length}</b> ad groups · Spend <b>${fmtVnd(t.spend)}</b>`
    + (t.installs ? ` · <b>${fmtInt(t.installs)}</b> installs @ CPI <b>${fmtVnd(t.cpi)}</b>` : " · no installs tracked")
    + ` · CTR ${fmtPct(t.ctr)}.`);
  const cand = all.filter(c => c.installs >= 10);
  if (cand.length) {
    const best = cand.slice().sort((a, b) => a.cpi - b.cpi)[0];
    out.push(`Best CPI: <b>${best.name}</b> (${best.campaign}) — ${fmtVnd(best.cpi)} on ${fmtInt(best.installs)} installs (CTR ${fmtPct(best.ctr)}).`);
    const worst = cand.slice().sort((a, b) => b.cpi - a.cpi)[0];
    if (worst !== best) out.push({warn: true, html: `Worst CPI: <b>${worst.name}</b> (${worst.campaign}) — ${fmtVnd(worst.cpi)} on ${fmtInt(worst.installs)} installs, spend ${fmtVnd(worst.spend)}.`});
  }
  const ts = all.slice().sort((a, b) => b.spend - a.spend)[0];
  out.push(`Highest spend: <b>${ts.name}</b> (${ts.campaign}) — ${fmtVnd(ts.spend)}`
    + (ts.installs ? `, CPI ${fmtVnd(ts.cpi)}` : "") + `, CTR ${fmtPct(ts.ctr)}.`);
  return out;
}

function googleAccountPanelHTML(acc) {
  const t = ggTotals(acc.creatives);
  const rows = acc.creatives.slice().sort((a, b) => {
    const x = a[sortKey], y = b[sortKey];
    if (typeof x === "string") return sortDir * String(x).localeCompare(String(y));
    return sortDir * ((x || 0) - (y || 0));
  });
  const insRows = computeGoogleAccountInsights(acc);
  const insHTML = insRows.length
    ? `<div class="insights" style="margin:0 0 16px"><div class="ins-head">💡 KEY INSIGHTS — ${acc.label.toUpperCase()} <span style="font-weight:600;color:var(--muted)">· focus: CPI (app install)</span></div>`
      + insRows.map(r => typeof r === "string" ? `<div class="ins-row">${r}</div>` : `<div class="ins-row warn">${r.html}</div>`).join("") + `</div>`
    : "";
  return insHTML + `
    <div class="panel">
      <div class="panel-head">
        <b>${acc.label}</b>
        <span>Spend ${fmtVnd(t.spend)}</span>
        <span>Impr ${fmtInt(t.impressions)}</span>
        <span>Clicks ${fmtInt(t.clicks)}</span>
        <span>CTR ${fmtPct(t.ctr)}</span>
        ${t.installs ? `<span>Installs ${fmtInt(t.installs)} @ CPI ${fmtVnd(t.cpi)}</span>` : ""}
        <span>${rows.length} ad groups</span>
      </div>
      ${tableHTML(rows, GCOLS, true)}
    </div>`;
}

function applyRangeGoogle(key) {
  curRange = key;
  const byAcct = ggWindow(key);
  DATA = {accounts: GG.accounts.map(a => ({kind: "account", label: a.name, group: (a.phase || "").toUpperCase(), creatives: byAcct.get(a.name) || []}))};
  DATA.tabs = DATA.accounts;
  activeIdx = Math.min(Math.max(activeIdx, 0), DATA.tabs.length - 1);
  document.getElementById("period").textContent = RANGES[key].period_label || "";
  renderGoogleCards(); renderGoogleInsights(); renderTabs(); renderControls(); renderPanel();
}

function switchPlatform(p) {
  if (p === platform || (p === "google" && !GG)) return;
  platform = p;
  activeIdx = 0; sortKey = "spend"; sortDir = -1; viewMode = "creative"; showCampaign = false;
  document.getElementById("pf-meta").className = "pf" + (p === "meta" ? " active" : "");
  document.getElementById("pf-google").className = "pf" + (p === "google" ? " active" : "");
  document.getElementById("pf-campaign").className = "pf" + (p === "campaign" ? " active" : "");
  const titles = {
    meta: "📊 Chotot Meta Ads — Creative Performance",
    google: "🔍 Chotot Google Ads — Campaign / Ad group",
    campaign: "🎯 Chotot Campaign Reports — Awareness → Install",
  };
  document.getElementById("title").textContent = titles[p] || titles.meta;
  applyRange(curRange);
}

function applyRange(key) {
  if (platform === "google") { applyRangeGoogle(key); return; }
  if (platform === "campaign") { applyRangeCampaign(key); return; }
  curRange = key;
  applyAirbridge(key);
  const accounts = RANGES[key].accounts;
  DATA = {accounts};
  DATA.tabs = accounts.map(a => ({kind: "account", ...a}));
  activeIdx = Math.min(Math.max(activeIdx, 0), DATA.tabs.length - 1);
  document.getElementById("period").textContent = RANGES[key].period_label || "";
  renderCards(); renderInsights(); renderTabs(); renderControls(); renderPanel();
}

// CAMPAIGN view: the themed Brand-team campaigns (Thổ Địa, Back to School) that
// sync awareness -> app install, promoted to their own top-level section next to
// Meta / Google. Sub-tabs = the campaigns; cards summarize the selected campaign.
function renderCampaignCards() {
  const tab = DATA.tabs[activeIdx];
  const all = [];
  if (tab && tab.sections) tab.sections.forEach(s => s.creatives.forEach(c => all.push(normalize(c))));
  const sum = k => all.reduce((s, c) => s + (c[k] || 0), 0);
  const spend = sum("spend"), impr = sum("impressions"), clk = sum("clicks"), ins = sum("installs");
  const ctr = impr ? clk / impr * 100 : 0, cpi = ins ? spend / ins : 0;
  const cards = [
    {k: "Total Spend", v: fmtMoney(spend), accent: true},
    {k: "Impressions", v: fmtInt(impr)},
    {k: "Clicks", v: fmtInt(clk)},
    {k: "Avg CTR", v: fmtPct(ctr)},
    {k: AB ? "Installs · Airbridge" : "Installs", v: ins ? fmtInt(ins) : "–"},
    {k: "Avg CPI", v: cpi ? fmtVndSgd(cpi) : "–"},
    {k: "Creatives", v: fmtInt(all.length)},
  ];
  document.getElementById("cards").innerHTML = cards.map(c =>
    `<div class="card"><div class="k">${c.k}</div><div class="v ${c.accent ? "accent" : ""}">${c.v}</div></div>`
  ).join("");
}

function applyRangeCampaign(key) {
  curRange = key;
  applyAirbridge(key);
  const accounts = RANGES[key].accounts;
  DATA = {accounts, tabs: buildCampaignTabs(accounts)};
  activeIdx = Math.min(Math.max(activeIdx, 0), DATA.tabs.length - 1);
  document.getElementById("period").textContent = RANGES[key].period_label || "";
  document.getElementById("insights").style.display = "none";  // per-section insights suffice
  renderCampaignCards(); renderTabs(); renderControls(); renderPanel();
}

Promise.all([
  fetch("./data/latest.json?v=" + Date.now()).then(r => r.json()),
  fetch("./data/airbridge_installs.json?v=" + Date.now()).then(r => r.ok ? r.json() : null).catch(() => null),
  fetch("./data/google_data.json?v=" + Date.now()).then(r => r.ok ? r.json() : null).catch(() => null),
])
  .then(([d, ab, gg]) => {
    RAW = d;
    AB = ab;
    GG = gg;
    if (AB) console.log("Airbridge installs loaded:", AB.date_range, Object.keys(AB.by_day || {}).length, "days");
    if (GG) console.log("Google data loaded:", GG.accounts, Object.keys(GG.by_day || {}).length, "days, through", GG.data_through);
    // New schema has `ranges`; fall back to old flat schema for safety.
    RANGES = d.ranges || {all: {label: "", period_label: d.period_label, accounts: d.accounts}};
    const keys = Object.keys(RANGES);
    const sel = document.getElementById("range");
    sel.innerHTML = keys.map(k => `<option value="${k}">${RANGES[k].label || k}</option>`).join("");
    curRange = (d.default_range && RANGES[d.default_range]) ? d.default_range : keys[0];
    sel.value = curRange;
    sel.onchange = () => applyRange(sel.value);

    document.getElementById("generated").textContent = "Updated: " + (d.generated_at || "").replace("T", " ").replace("Z", " UTC");
    const abNote = AB ? "  ·  installs from Airbridge MMP (data through " + (AB.date_range ? AB.date_range[1] : "?") + ")" : "";
    document.getElementById("foot").textContent = "Freq badge:  <3× (ok) · 3–7× (watch) · ≥7× (high)  ·  Group by creative: reach is summed (estimate)  ·  VND @ 1 SGD = " + SGD_TO_VND.toLocaleString("en-US") + "  —  performance data from Meta Marketing API" + abNote;
    document.getElementById("btn-creative").onclick = () => setView("creative");
    document.getElementById("btn-format").onclick = () => setView("format");
    document.getElementById("btn-perad").onclick = () => setView("ad");
    document.getElementById("btn-campaign").onclick = toggleCampaign;

    // Top-level Meta / Google switch. Hide the Google button if no snapshot.
    document.getElementById("pf-meta").onclick = () => switchPlatform("meta");
    document.getElementById("pf-google").onclick = () => switchPlatform("google");
    document.getElementById("pf-campaign").onclick = () => switchPlatform("campaign");
    if (!GG) document.getElementById("pf-google").style.display = "none";

    applyRange(curRange);
  })
  .catch(e => { document.getElementById("panel").innerHTML = `<div class="err">Failed to load data/latest.json<br>${e}</div>`; });
</script>
</body>
