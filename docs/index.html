<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chotot Meta Ads — Creative Performance</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --line: #e6e8eb; --ink: #1a1a2e;
    --muted: #6b7280; --accent: #6d28d9; --green: #059669; --amber: #d97706; --red: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 60px; }
  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  .range-select { font-size: 13px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); cursor: pointer; margin-bottom: 6px; }
  .platform-switch { display: inline-flex; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); align-self: center; }
  .platform-switch .pf { border: none; background: transparent; padding: 9px 20px; font-size: 14px; font-weight: 700; color: var(--muted); cursor: pointer; }
  .platform-switch .pf.active { background: var(--accent); color: #fff; }
  .platform-switch .pf:not(.active):hover { background: #f3f0fd; color: var(--accent); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin: 22px 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .card .k { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .card .v { font-size: 24px; font-weight: 700; margin-top: 6px; }
  .card .v.accent { color: var(--accent); }
  .insights { background: #eff4ff; border: 1px solid #dbe4ff; border-radius: 12px; padding: 16px 20px; margin: 22px 0; }
  .insights .ins-head { font-size: 12px; font-weight: 700; letter-spacing: .04em; color: #3b5bdb; margin-bottom: 8px; }
  .insights .ins-row { padding: 8px 0; border-top: 1px solid #e0e7ff; font-size: 13px; line-height: 1.5; }
  .insights .ins-row:first-of-type { border-top: none; }
  .insights .ins-row::before { content: "→ "; color: #3b5bdb; font-weight: 700; }
  .insights .ins-row b { font-weight: 700; }
  .insights .warn::before { content: "⚠ "; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 14px; }
  .tab {
    border: 1px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 7px 14px; cursor: pointer; font-size: 13px; color: var(--muted);
  }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab .g { font-size: 10px; opacity: .7; margin-left: 6px; }
  .tab-camp { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .tab-camp.active { background: var(--accent); color: #fff; }
  .camp-note { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; font-size: 13px; line-height: 1.5; }
  .camp-sec { margin-bottom: 26px; }
  .sec-head { display: flex; align-items: baseline; gap: 10px; margin: 4px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--accent); }
  .sec-head b { font-size: 15px; }
  .sec-head span { color: var(--muted); font-size: 12px; }
  .empty { padding: 22px; text-align: center; color: var(--muted); font-size: 13px; }
  .controls { display: flex; align-items: center; gap: 8px; margin: 4px 0 14px; }
  .ctl-label { font-size: 12px; color: var(--muted); }
  .ctl { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 12px; color: var(--muted); }
  .ctl.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .pill { display: inline-block; margin-left: 8px; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; background: #ede9fe; color: var(--accent); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .panel-head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; gap: 18px; flex-wrap: wrap; align-items: baseline; }
  .panel-head b { font-size: 15px; }
  .panel-head span { color: var(--muted); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 14px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); cursor: pointer; user-select: none; }
  th.sorted::after { content: " ▾"; color: var(--accent); }
  tbody tr:hover { background: #faf9ff; }
  td.name { font-weight: 600; max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
  td.name.good { color: var(--green); }  /* top performer called out in KEY INSIGHTS */
  td.name a.post-link { color: inherit; text-decoration: none; }
  td.name a.post-link:hover { color: var(--accent); text-decoration: underline; }
  td.name a.post-link .ext { color: var(--accent); font-weight: 700; opacity: .7; }
  td.campaign { text-align: left; color: var(--muted); max-width: 240px; }
  td.campaign .camp-inner { display: flex; align-items: center; gap: 6px; }
  td.campaign .camp-txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .copy-btn { flex: none; border: none; background: transparent; cursor: pointer; color: var(--muted); font-size: 12px; padding: 0 2px; opacity: .55; line-height: 1; }
  .copy-btn:hover { opacity: 1; color: var(--accent); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .f-green { background: #dcfce7; color: var(--green); }
  .f-amber { background: #fef3c7; color: var(--amber); }
  .f-red { background: #fee2e2; color: var(--red); }
  .delta { font-size: 10px; font-weight: 700; margin-left: 5px; white-space: nowrap; }
  /* Comparison columns: value right-aligns to a fixed edge, delta sits in a
     reserved slot to its right (outside) so every main value lines up. */
  td.cmp .cdelta { display: inline-block; width: 48px; text-align: left; }
  th.cmp { padding-right: 62px; }
  .d-good { color: var(--green); }
  .d-bad { color: var(--red); }
  .d-flat { color: var(--muted); }
  .foot { color: var(--muted); font-size: 12px; margin-top: 22px; text-align: center; }
  .err { padding: 40px; text-align: center; color: var(--red); }
  /* Per-source data-freshness strip: each source carries its own "data through"
     date, and they are NOT in sync (Meta auto-refreshes weekly; the BigQuery /
     Sheet sources are pulled by hand). Surfacing every source's own asof date
     stops anyone reading e.g. Meta 14 Sep against Google 05 Aug as same period. */
  .freshness { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 2px; }
  .freshness .flabel { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .fchip { display: inline-flex; align-items: baseline; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; font-size: 12px; background: var(--card); }
  .fchip b { font-weight: 600; }
  .fchip .fdate { color: var(--muted); }
  .fchip .fago { font-size: 11px; font-weight: 600; }
  .fchip.fresh { border-color: var(--green); }
  .fchip.fresh .fago { color: var(--green); }
  .fchip.watch { border-color: var(--amber); }
  .fchip.watch .fago { color: var(--amber); }
  .fchip.stale { border-color: var(--red); background: #fef2f2; }
  .fchip.stale .fago { color: var(--red); }
  /* "So sánh" (Compare) view: a plain-language leaderboard grading each
     creative Tốt/Khá/Cần chú ý/Kém against the account's own median, so a
     non-technical reader can tell winners from losers without reading a
     dense numeric table. */
  .f-blue { background: #dbeafe; color: #1d4ed8; }
  .f-grey { background: #eef0f3; color: var(--muted); }
  .cmp-legend { background: #f8f7ff; border: 1px solid #e6e1fb; border-radius: 12px; padding: 12px 16px; margin-bottom: 14px; font-size: 12.5px; color: var(--muted); line-height: 1.9; }
  .cmp-legend b { color: var(--ink); }
  .grade-pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; margin-left: 4px; }
  .cmp-list { display: flex; flex-direction: column; gap: 10px; }
  .cmp-row { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; grid-template-columns: 30px 1fr 190px; gap: 14px; align-items: center; }
  .cmp-row.grade-good { border-left-color: var(--green); }
  .cmp-row.grade-ok { border-left-color: #2563eb; }
  .cmp-row.grade-watch { border-left-color: var(--amber); }
  .cmp-row.grade-poor { border-left-color: var(--red); }
  .cmp-row.grade-na { border-left-color: var(--line); opacity: .8; }
  .cmp-rank { font-size: 13px; font-weight: 700; color: var(--muted); text-align: center; }
  .cmp-name-line { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; flex-wrap: wrap; }
  .cmp-name-line a { font-weight: 700; color: var(--ink); text-decoration: none; }
  .cmp-name-line a:hover { color: var(--accent); text-decoration: underline; }
  .cmp-tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; background: #eef0f3; color: var(--muted); }
  .cmp-bar-track { position: relative; background: #eef0f3; border-radius: 999px; height: 7px; margin: 7px 0; }
  .cmp-bar-fill { height: 100%; border-radius: 999px; background: var(--accent); overflow: hidden; }
  .cmp-med-mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .35; }
  .cmp-row.grade-good .cmp-bar-fill { background: var(--green); }
  .cmp-row.grade-ok .cmp-bar-fill { background: #2563eb; }
  .cmp-row.grade-watch .cmp-bar-fill { background: var(--amber); }
  .cmp-row.grade-poor .cmp-bar-fill { background: var(--red); }
  .cmp-row.grade-na .cmp-bar-fill { background: var(--line); }
  .cmp-verdict { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  .cmp-verdict b { color: var(--ink); }
  .cmp-stats-col { text-align: right; font-size: 12px; color: var(--muted); line-height: 1.8; }
  .cmp-stats-col b { color: var(--ink); font-size: 13px; }
  .cmp-empty { padding: 22px; text-align: center; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">📊 Chotot Meta Ads — Creative Performance</h1>
      <div class="sub" id="period">…</div>
    </div>
    <div class="platform-switch" id="platform-switch">
      <button class="pf active" id="pf-meta">📊 Meta</button>
      <button class="pf" id="pf-google">🔍 Google</button>
      <button class="pf" id="pf-funnel">↘ Google &amp; Meta</button>
      <button class="pf" id="pf-campaign">🎯 Campaign</button>
    </div>
    <div style="text-align:right">
      <select id="range" class="range-select"></select>
      <div class="sub" id="generated">…</div>
    </div>
  </header>

  <div class="freshness" id="freshness"></div>

  <div class="cards" id="cards"></div>
  <div class="insights" id="insights" style="display:none"></div>
  <div class="controls" id="fnl-channel" style="display:none">
    <span class="ctl-label">Channel:</span>
    <button class="ctl" id="btn-fnl-all">All</button>
    <button class="ctl" id="btn-fnl-google">Google</button>
    <button class="ctl" id="btn-fnl-meta">Meta</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="controls" id="view-controls">
    <span class="ctl-label">View:</span>
    <button class="ctl" id="btn-compare">🏆 So sánh</button>
    <button class="ctl" id="btn-creative">By creative</button>
    <button class="ctl" id="btn-format">By format</button>
    <button class="ctl" id="btn-perad">Per ad</button>
  </div>
  <div class="controls" id="gg-view-controls" style="display:none">
    <span class="ctl-label">View:</span>
    <button class="ctl" id="btn-gg-compare">🏆 So sánh</button>
    <button class="ctl" id="btn-gg-detail">Chi tiết</button>
  </div>
  <div id="panel"></div>

  <div class="foot" id="foot"></div>
</div>

<script>
const CUR = "SGD";
const SGD_TO_VND = 20337;  // exchange rate used for the VND columns
let RAW = null, RANGES = {}, curRange = null;
let DATA = null, activeIdx = 0, sortKey = "spend", sortDir = -1, viewMode = "compare";
let showCampaign = false;  // Campaign column is collapsed by default (toggle to show)
let campAppTab = "meta";   // Campaign tab: App install sub-tab — "meta" (FB) | "google" (GG)
let campDemandTab = "meta"; // Campaign tab: Demand sub-tab — "meta" (FB) | "google" (GG)
let AB = null;  // Airbridge MMP installs snapshot (docs/data/airbridge_installs.json)
let GG = null;  // Google Ads snapshot (docs/data/google_data.json): sheet cost + Airbridge installs
let DEM = null; // Demand snapshot (docs/data/demand_data.json): raw_retention campaign-level lead/DAU (FB+GG)
let FNL = null; // Google PMax + Meta ad cost joined to warehouse funnel metrics (merged from two source files)
let fnlChannel = "ALL"; // "ALL" | "GOOGLE" | "META" — channel filter for the funnel view only
let platform = "meta";  // top-level view: "meta" (default) | "google" | "funnel" | "campaign"
let subViewMode = "compare"; // Google / Funnel view toggle: "compare" | "detail" (mutually exclusive with `platform`, so one var covers both)
function setSubView(m) { subViewMode = m; renderControls(); renderPanel(); }

// --- Airbridge install override -----------------------------------------
// Installs come from the Airbridge MMP (last-click attribution), NOT Meta's
// self-reported numbers. AB.by_day = { "YYYY-MM-DD": { "<ad_id>": installs } }.
// We sum per-ad installs over each preset's date window (today-relative, so
// the number stays fresh even when Meta spend is a few days old) and overwrite
// installs + cpi + prev_installs on every creative.
const _ymd = dt => dt.toISOString().slice(0, 10);
const _addDays = (dt, n) => { const x = new Date(dt); x.setUTCDate(x.getUTCDate() + n); return x; };
const _today0 = () => { const n = new Date(); return new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())); };
const _firstOfMonth = dt => new Date(Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth(), 1));

function abWindow(key) {
  const t = _today0(), y = _addDays(t, -1);
  let s, e;
  if (key === "yesterday") { s = e = y; }
  else if (key === "last_7d") { e = y; s = _addDays(t, -7); }
  else if (key === "last_14d") { e = y; s = _addDays(t, -14); }
  else if (key === "last_30d") { e = y; s = _addDays(t, -30); }
  else if (key === "this_month") { s = _firstOfMonth(t); e = t; }
  else if (key === "last_month") { e = _addDays(_firstOfMonth(t), -1); s = _firstOfMonth(e); }
  else { s = e = t; }
  return {since: _ymd(s), until: _ymd(e)};
}

function abPrevWindow(key) {
  const t = _today0();
  if (key === "yesterday") { const d = _addDays(t, -2); return {since: _ymd(d), until: _ymd(d)}; }
  if (key === "last_7d")  return {since: _ymd(_addDays(t, -14)), until: _ymd(_addDays(t, -8))};
  if (key === "last_14d") return {since: _ymd(_addDays(t, -28)), until: _ymd(_addDays(t, -15))};
  if (key === "last_30d") return {since: _ymd(_addDays(t, -60)), until: _ymd(_addDays(t, -31))};
  if (key === "this_month") {
    const start = _firstOfMonth(t), elapsed = Math.round((t - start) / 86400000);
    const prevEnd = _addDays(start, -1), prevStart = _firstOfMonth(prevEnd);
    return {since: _ymd(prevStart), until: _ymd(_addDays(prevStart, elapsed))};
  }
  if (key === "last_month") {
    const end = _addDays(_firstOfMonth(t), -1), start = _firstOfMonth(end), prevEnd = _addDays(start, -1);
    return {since: _ymd(_firstOfMonth(prevEnd)), until: _ymd(prevEnd)};
  }
  return null;
}

// Sum Airbridge installs for one ad_id over [since, until] (dates compare lexically).
function abSum(id, since, until) {
  if (!AB || !AB.by_day) return 0;
  let s = 0;
  for (const day in AB.by_day) {
    if (day >= since && day <= until) { const v = AB.by_day[day][id]; if (v) s += v; }
  }
  return s;
}

// Overwrite installs/cpi/prev_installs on every creative in a range from Airbridge.
function applyAirbridge(key) {
  if (!AB || !AB.by_day || !RANGES[key] || RANGES[key]._abApplied) return;
  const cur = abWindow(key), prev = abPrevWindow(key);
  RANGES[key].accounts.forEach(a => a.creatives.forEach(c => {
    if (!c.id) return;
    c.installs = abSum(c.id, cur.since, cur.until);
    c.cpi = c.installs ? +(c.spend / c.installs).toFixed(2) : 0;
    if (prev) c.prev_installs = abSum(c.id, prev.since, prev.until);
  }));
  RANGES[key]._abApplied = true;
}

const fmtInt = n => n.toLocaleString("en-US");
const fmtMoney = n => CUR + " " + n.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const fmtVnd = n => "₫" + Math.round(n).toLocaleString("en-US");
const fmtVndSgd = n => fmtVnd(n * SGD_TO_VND);  // value is in SGD -> render as VND
const fmtPct = n => n.toFixed(2) + "%";
const fmtDash = f => n => (n > 0 && isFinite(n)) ? f(n) : "–";  // show "–" instead of 0

function freqBadge(f) {
  const cls = f >= 7 ? "f-red" : (f >= 3 ? "f-amber" : "f-green");
  return `<span class="badge ${cls}">${f.toFixed(2)}×</span>`;
}

function accountTotals(acc) {
  const t = {spend: 0, impressions: 0, reach: 0, clicks: 0, installs: 0};
  acc.creatives.forEach(c => { t.spend += c.spend; t.impressions += c.impressions; t.reach += c.reach; t.clicks += c.clicks; t.installs += (c.installs || 0); });
  t.ctr = t.impressions ? t.clicks / t.impressions * 100 : 0;
  t.count = acc.creatives.length;
  return t;
}

// % change of current vs previous period for CTR and CPI (null = no prior data).
function deltas(ctr, cpi, pImpr, pClicks, pSpend, pInst) {
  const pCtr = pImpr ? pClicks / pImpr * 100 : 0;
  const pCpi = pInst ? pSpend / pInst : 0;
  return {
    ctr_d: pCtr ? (ctr - pCtr) / pCtr * 100 : null,
    cpi_d: pCpi ? (cpi - pCpi) / pCpi * 100 : null,
  };
}

// Recompute rate/derived metrics from a summed bucket.
function withRates(g) {
  const cpi = g.installs ? g.spend / g.installs : 0;
  const ctr = g.impressions ? g.clicks / g.impressions * 100 : 0;
  const formats = g._formats ? [...g._formats] : [];
  const campaigns = g._campaigns ? [...g._campaigns].filter(Boolean) : [];
  const out = {
    ...g,
    campaign: campaigns.length === 1 ? campaigns[0] : (campaigns.length > 1 ? "Nhiều chiến dịch" : (g.campaign || "—")),
    ctr,
    cpc: g.clicks ? g.spend / g.clicks : 0,
    cpm: g.impressions ? g.spend / g.impressions * 1000 : 0,
    frequency: g.reach ? g.impressions / g.reach : 0,
    cpi,
    eng_rate: g.impressions ? g.engagement / g.impressions * 100 : 0,
    hook_rate: g.impressions ? (g.video_3s || 0) / g.impressions * 100 : 0,
    hold_rate: g.impressions ? (g.thruplay || 0) / g.impressions * 100 : 0,
    spend_vnd: g.spend * SGD_TO_VND,
    cpi_vnd: cpi * SGD_TO_VND,
    format: formats.length === 1 ? formats[0] : (formats.length > 1 ? "Mixed" : (g.format || "Other")),
    ...deltas(ctr, cpi, g.prev_impressions, g.prev_clicks, g.prev_spend, g.prev_installs),
  };
  delete out._formats;
  delete out._campaigns;
  return out;
}

// Merge rows that share the same key into one bucket (sums + recomputed rates).
function aggregateBy(creatives, keyFn) {
  const map = new Map();
  creatives.forEach(c => {
    const key = keyFn(c);
    const g = map.get(key) || {name: key, ads: 0, spend: 0, impressions: 0, reach: 0, clicks: 0,
      installs: 0, engagement: 0, video_3s: 0, thruplay: 0, prev_spend: 0, prev_impressions: 0, prev_clicks: 0, prev_installs: 0, post_url: "", _formats: new Set(), _campaigns: new Set()};
    if (!g.post_url && c.post_url) g.post_url = c.post_url;
    g.ads++; g.spend += c.spend; g.impressions += c.impressions; g.reach += c.reach;
    g.clicks += c.clicks; g.installs += (c.installs || 0); g.engagement += (c.engagement || 0);
    g.video_3s += (c.video_3s || 0); g.thruplay += (c.thruplay || 0);
    g.prev_spend += (c.prev_spend || 0); g.prev_impressions += (c.prev_impressions || 0);
    g.prev_clicks += (c.prev_clicks || 0); g.prev_installs += (c.prev_installs || 0);
    g._formats.add(c.format || "Other");
    g._campaigns.add(c.campaign || "");
    map.set(key, g);
  });
  return [...map.values()].map(withRates);
}

const aggregateByName = creatives => aggregateBy(creatives, c => c.name);
const aggregateByFormat = creatives => aggregateBy(creatives, c => c.format || "Other");

// Per-ad row: guarantee installs/cpi/format/engagement exist even for older data files.
function normalize(c) {
  const installs = c.installs || 0;
  const cpi = c.cpi != null ? c.cpi : (installs ? c.spend / installs : 0);
  const engagement = c.engagement || 0;
  return {...c, ads: 1, installs, cpi, engagement, format: c.format || "Other", campaign: c.campaign || "—",
    eng_rate: c.eng_rate != null ? c.eng_rate : (c.impressions ? engagement / c.impressions * 100 : 0),
    hook_rate: c.hook_rate != null ? c.hook_rate : (c.impressions ? (c.video_3s || 0) / c.impressions * 100 : 0),
    hold_rate: c.hold_rate != null ? c.hold_rate : (c.impressions ? (c.thruplay || 0) / c.impressions * 100 : 0),
    spend_vnd: c.spend * SGD_TO_VND, cpi_vnd: cpi * SGD_TO_VND,
    ...deltas(c.ctr || 0, cpi, c.prev_impressions || 0, c.prev_clicks || 0, c.prev_spend || 0, c.prev_installs || 0)};
}

// Auto-generated creative insights for the selected range (all accounts).
function computeInsights(accounts) {
  const all = [];
  accounts.forEach(a => a.creatives.forEach(c => all.push({...normalize(c), account: a.label})));
  if (!all.length) return [];

  const sum = k => all.reduce((s, c) => s + (c[k] || 0), 0);
  const spend = sum("spend"), installs = sum("installs"), impr = sum("impressions"), clicks = sum("clicks");
  const ctr = impr ? clicks / impr * 100 : 0;
  const cpi = installs ? spend / installs : 0;
  const out = [];

  // 1) Overview
  out.push(`<b>${fmtInt(all.length)}</b> creatives across <b>${accounts.length}</b> accounts · Spend <b>${fmtMoney(spend)}</b>`
    + (installs ? ` · <b>${fmtInt(installs)}</b> installs @ CPI ${fmtVndSgd(cpi)}` : "")
    + ` · Avg CTR ${fmtPct(ctr)}.`);

  // 2) Format that captures the most spend
  const fmt = aggregateByFormat(all).sort((a, b) => b.spend - a.spend);
  if (fmt.length) {
    const lead = fmt[0];
    out.push(`Top format by spend: <b>${lead.name}</b> — ${fmtMoney(lead.spend)} `
      + `(${spend ? Math.round(lead.spend / spend * 100) : 0}% of spend, ${lead.ads} ads, CTR ${fmtPct(lead.ctr)}`
      + (lead.installs ? `, CPI ${fmtVndSgd(lead.cpi)}` : "") + ").");
  }

  // 3) Most efficient format by CPI (only when installs exist to compare)
  const withInst = fmt.filter(f => f.installs > 0);
  if (withInst.length > 1) {
    const best = withInst.slice().sort((a, b) => a.cpi - b.cpi)[0];
    out.push(`Most efficient format: <b>${best.name}</b> at CPI ${fmtVndSgd(best.cpi)} on ${fmtInt(best.installs)} installs.`);
  }

  // 4) Highest-spend creative
  const topSpend = all.slice().sort((a, b) => b.spend - a.spend)[0];
  out.push(`Highest-spend creative: <b>${topSpend.name}</b> (${topSpend.account}) — ${fmtMoney(topSpend.spend)}, CTR ${fmtPct(topSpend.ctr)}`
    + (topSpend.installs ? `, CPI ${fmtVndSgd(topSpend.cpi)}` : "") + ".");

  // 5) Best CPI creative (min 5 installs to avoid noise)
  const cand = all.filter(c => c.installs >= 5);
  if (cand.length) {
    const bestCpi = cand.slice().sort((a, b) => a.cpi - b.cpi)[0];
    out.push(`Best CPI: <b>${bestCpi.name}</b> (${bestCpi.account}) — CPI ${fmtVndSgd(bestCpi.cpi)} on ${fmtInt(bestCpi.installs)} installs.`);
  }

  // 6) Frequency fatigue watch
  const fatig = all.filter(c => c.frequency >= 7);
  if (fatig.length) {
    const worst = fatig.slice().sort((a, b) => b.frequency - a.frequency)[0];
    out.push({warn: true, html: `Frequency watch: <b>${fatig.length}</b> creatives at ≥7× `
      + `(highest ${worst.frequency.toFixed(1)}× — ${worst.name}, ${worst.account}). Consider refreshing the creative.`});
  }

  return out;
}

function renderInsights() {
  const box = document.getElementById("insights");
  const rows = computeInsights(DATA.accounts);
  if (!rows.length) { box.style.display = "none"; return; }
  const period = (RANGES[curRange] && RANGES[curRange].period_label) || "";
  box.style.display = "";
  box.innerHTML = `<div class="ins-head">💡 KEY INSIGHTS${period ? " — " + period.toUpperCase() : ""}</div>`
    + rows.map(r => typeof r === "string"
        ? `<div class="ins-row">${r}</div>`
        : `<div class="ins-row warn">${r.html}</div>`).join("");
}

// Per-account insights, tailored to the team's objective:
//   GROWTH accounts run app installs -> CPI is the headline metric.
//   BRAND  accounts run awareness    -> Hook / CTR / ER are the headline metrics.
function computeAccountInsights(acc) {
  const all = acc.creatives.map(normalize);
  if (!all.length) return [];
  const brand = (acc.group || "").toUpperCase() === "BRAND";
  const sum = k => all.reduce((s, c) => s + (c[k] || 0), 0);
  const spend = sum("spend"), installs = sum("installs"), impr = sum("impressions"),
        clicks = sum("clicks"), eng = sum("engagement"), v3 = sum("video_3s");
  const ctr = impr ? clicks / impr * 100 : 0;
  const cpi = installs ? spend / installs : 0;
  const er = impr ? eng / impr * 100 : 0;
  const d = deltas(ctr, cpi, sum("prev_impressions"), sum("prev_clicks"), sum("prev_spend"), sum("prev_installs"));
  const out = [];

  if (brand) {
    // --- BRAND: Hook / CTR / ER ---
    const vid = aggregateByFormat(acc.creatives).find(f => f.name === "Video");
    out.push(`<b>${all.length}</b> creatives · Spend <b>${fmtMoney(spend)}</b> · CTR <b>${fmtPct(ctr)}</b>${deltaBadge(d.ctr_d, false)}`
      + ` · ER <b>${fmtPct(er)}</b>` + (vid && vid.hook_rate ? ` · Hook <b>${fmtPct(vid.hook_rate)}</b> (video)` : "") + ".");

    const vids = all.filter(c => c.format === "Video" && c.impressions >= 500 && c.hook_rate > 0);
    if (vids.length) {
      const bh = vids.slice().sort((a, b) => b.hook_rate - a.hook_rate)[0];
      out.push(`Best hook: <b>${bh.name}</b> — Hook ${fmtPct(bh.hook_rate)}, Hold ${fmtPct(bh.hold_rate)} on ${fmtInt(bh.impressions)} impr.`);
    }
    const cc = all.filter(c => c.impressions >= 500);
    if (cc.length) {
      const bc = cc.slice().sort((a, b) => b.ctr - a.ctr)[0];
      out.push(`Best CTR: <b>${bc.name}</b> — ${fmtPct(bc.ctr)} (${fmtInt(bc.clicks)} clicks, spend ${fmtMoney(bc.spend)}).`);
      const be = cc.slice().sort((a, b) => b.eng_rate - a.eng_rate)[0];
      out.push(`Best engagement rate: <b>${be.name}</b> — ER ${fmtPct(be.eng_rate)} (${fmtInt(be.engagement)} post eng.).`);
    }
  } else {
    // --- GROWTH: CPI ---
    out.push(`<b>${all.length}</b> creatives · Spend <b>${fmtMoney(spend)}</b>`
      + (installs ? ` · <b>${fmtInt(installs)}</b> installs @ CPI <b>${fmtVndSgd(cpi)}</b>${deltaBadge(d.cpi_d, true)}` : " · no installs tracked")
      + ` · CTR ${fmtPct(ctr)}${deltaBadge(d.ctr_d, false)}.`);

    const cand = all.filter(c => c.installs >= 5);
    if (cand.length) {
      const best = cand.slice().sort((a, b) => a.cpi - b.cpi)[0];
      out.push(`Best CPI: <b>${best.name}</b> — ${fmtVndSgd(best.cpi)} on ${fmtInt(best.installs)} installs (CTR ${fmtPct(best.ctr)}).`);
      const worst = cand.slice().sort((a, b) => b.cpi - a.cpi)[0];
      if (worst !== best) {
        out.push({warn: true, html: `Worst CPI: <b>${worst.name}</b> — ${fmtVndSgd(worst.cpi)} on ${fmtInt(worst.installs)} installs, spend ${fmtMoney(worst.spend)}. Consider optimizing/pausing.`});
      }
    }
    const ts = all.slice().sort((a, b) => b.spend - a.spend)[0];
    out.push(`Highest spend: <b>${ts.name}</b> — ${fmtMoney(ts.spend)}`
      + (ts.installs ? `, CPI ${fmtVndSgd(ts.cpi)}` : "") + `, CTR ${fmtPct(ts.ctr)}.`);
  }

  // Frequency fatigue watch (both objectives).
  const fat = all.filter(c => c.frequency >= 7);
  if (fat.length) {
    const w = fat.slice().sort((a, b) => b.frequency - a.frequency)[0];
    out.push({warn: true, html: `Frequency watch: <b>${fat.length}</b> creatives at ≥7× (highest ${w.frequency.toFixed(1)}× — ${w.name}). Consider refreshing.`});
  }
  return out;
}

// Names of the "top performer" creatives called out positively in the KEY
// INSIGHTS (Best hook / Best CTR / Best ER for BRAND; Best CPI for GROWTH).
// Mirrors the "best" picks in computeAccountInsights so the detail table can
// highlight those creative names green. (Worst CPI / Highest spend / Frequency
// watch are NOT highlighted — those aren't "good".)
function goodCreativeNames(acc) {
  const all = (acc.creatives || []).map(normalize);
  const set = new Set();
  if (!all.length) return set;
  const brand = (acc.group || "").toUpperCase() === "BRAND";
  if (brand) {
    const vids = all.filter(c => c.format === "Video" && c.impressions >= 500 && c.hook_rate > 0);
    if (vids.length) set.add(vids.slice().sort((a, b) => b.hook_rate - a.hook_rate)[0].name);
    const cc = all.filter(c => c.impressions >= 500);
    if (cc.length) {
      set.add(cc.slice().sort((a, b) => b.ctr - a.ctr)[0].name);
      set.add(cc.slice().sort((a, b) => b.eng_rate - a.eng_rate)[0].name);
    }
  } else {
    const cand = all.filter(c => c.installs >= 5);
    if (cand.length) set.add(cand.slice().sort((a, b) => a.cpi - b.cpi)[0].name);
  }
  return set;
}

  "impressions", "clicks", "ctr", "cpc", "cpm", "engagement", "eng_rate",

// Build one <table>. When sortable, headers wire to sortBy and highlight sortKey.
function tableHTML(rows, cols, sortable, goodNames) {
  const head = cols.map(c =>
    `<th class="${sortable && c.k === sortKey ? "sorted" : ""}${c.d ? " cmp" : ""}"${sortable ? ` onclick="sortBy('${c.k}')"` : ""}>${c.label}</th>`
  ).join("");
  const body = rows.map(r => "<tr>" + cols.map(c => {
    if (c.k === "name") {
      const tag = r.ads > 1 ? `<span class="pill">×${r.ads} ads</span>` : "";
      // Linkify the creative name to its FB post (skip the "Format" first column).
      const nm = (c.label !== "Format" && r.post_url)
        ? `<a class="post-link" href="${r.post_url}" target="_blank" rel="noopener" title="Xem post trên Facebook: ${r.name}">${r.name} <span class="ext">↗</span></a>`
        : r.name;
      const good = goodNames && goodNames.has(r.name) ? " good" : "";
      return `<td class="name${good}" title="${r.name}">${nm}${tag}</td>`;
    }
    if (c.k === "campaign") {
      const cp = r.campaign || "—";
      const safe = String(cp).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
      const btn = cp !== "—"
        ? `<button class="copy-btn" title="Copy tên campaign" onclick="copyCamp(this, event)">⧉</button>`
        : "";
      return `<td class="campaign" title="${safe}"><div class="camp-inner"><span class="camp-txt">${cp}</span>${btn}</div></td>`;
    }
    const val = c.f ? c.f(r[c.k]) : r[c.k];
    if (c.d) {
      const badge = deltaBadge(r[c.d], c.goodDown);
      return `<td class="cmp">${val}<span class="cdelta">${badge}</span></td>`;
    }
    return `<td>${val}</td>`;
  }).join("") + "</tr>").join("");
  return `<div style="overflow-x:auto"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

// Copy the full campaign name (read from the cell's title) to the clipboard,
// with a brief ✓ confirmation on the button.
function copyCamp(btn, ev) {
  if (ev) ev.stopPropagation();
  const cell = btn.closest("td.campaign");
  const text = cell ? cell.getAttribute("title") : "";
  const done = () => { const o = btn.textContent; btn.textContent = "✓"; setTimeout(() => { btn.textContent = o; }, 1000); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => done());
  } else {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta); done();
  }
}

// Small ▲/▼ % change badge vs previous period. goodDown=true means a drop is good (e.g. CPI).
function deltaBadge(pct, goodDown) {
  if (pct == null || !isFinite(pct)) return "";
  const up = pct >= 0;
  const good = goodDown ? !up : up;
  const cls = Math.abs(pct) < 0.5 ? "d-flat" : (good ? "d-good" : "d-bad");
  return ` <span class="delta ${cls}" title="vs previous period">${up ? "▲" : "▼"}${Math.abs(pct).toFixed(0)}%</span>`;
}

// --- "So sánh" (Compare) view -------------------------------------------
// A plain-language leaderboard/chart for non-data readers: grade every
// creative Tốt / Khá / Cần chú ý / Kém against the MEDIAN of its own account
// (same group of creatives, same date range), on a metric the reader picks
// (default: CPI for GROWTH accounts / CTR for BRAND, since that's what each
// is actually bought for — but any account can be re-sliced by Hook/Hold/
// Frequency too). Relative-to-median (not an absolute external benchmark)
// because spend/format/vertical mix differs enough account-to-account that
// no single external bar would be fair.
const GRADE_ORDER = {good: 0, ok: 1, watch: 2, poor: 3, na: 4};
const GRADE_LABEL = {good: "Tốt", ok: "Khá", watch: "Cần chú ý", poor: "Kém", na: "Chưa đủ dữ liệu"};

let compareMetric = null; // null = auto (CPI for GROWTH / CTR for BRAND); else an explicit METRICS key

// direction; `costLike` only changes the verdict wording ("rẻ hơn/đắt hơn"
// vs "cao hơn/thấp hơn"). `actions` are the plain-language recommendation
// per grade tier, phrased for the metric's own meaning (cost vs quality vs
// fatigue) rather than one generic sentence.
const METRICS = {
  cpi: {key: "cpi", label: "CPI", unitDesc: "chi phí / lượt cài đặt", higherBetter: false, costLike: true,
    minOk: r => r.installs >= 5 && r.cpi > 0, minDesc: "tối thiểu 5 lượt cài đặt",
    val: r => fmtVnd(r.cpi_vnd), med: m => fmtVnd(m * SGD_TO_VND),
    actions: {good: "hiệu quả, đáng cân nhắc tăng ngân sách.", watch: "theo dõi thêm, chưa cần thay ngay.", poor: "cân nhắc tắt hoặc thay creative."}},
  ctr: {key: "ctr", label: "CTR", unitDesc: "tỷ lệ click", higherBetter: true,
    minOk: r => r.impressions >= 500, minDesc: "tối thiểu 500 lượt hiển thị",
    val: r => fmtPct(r.ctr), med: m => fmtPct(m),
    actions: {good: "content đang hút chú ý, nên nhân bản góc content này.", watch: "theo dõi thêm, chưa cần thay ngay.", poor: "nên đổi sang creative/góc content khác."}},
  spend: {key: "spend", label: "Spend", unitDesc: "mức chi tiêu", higherBetter: true,

function median(arr) {
  if (!arr.length) return 0;
  const s = arr.slice().sort((a, b) => a - b);
  const mid = Math.floor(s.length / 2);
  return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
}

// ratio = metric / median. Tiers are wider on the "poor" side because a big
// blow-up (cost, fatigue) is usually the more actionable/urgent signal than
// a merely-average creative.
function gradeCreative(ratio, higherBetter) {
  if (higherBetter) {
    if (ratio >= 1.2) return "good";
    if (ratio >= 0.85) return "ok";
    if (ratio >= 0.5) return "watch";
    return "poor";
  }
  if (ratio <= 0.8) return "good";
  if (ratio <= 1.15) return "ok";
  if (ratio <= 1.6) return "watch";
  return "poor";
}

function computeCompareRows(acc) {
  const metricKey = compareMetric || ((acc.group || "").toUpperCase() === "BRAND" ? "ctr" : "cpi");
  const metric = METRICS[metricKey];
  const rows = aggregateByName(acc.creatives);
  const qualified = rows.filter(metric.minOk);
  const best = qualified.length ? (metric.higherBetter ? Math.max(...qualified.map(r => r[metric.key])) : Math.min(...qualified.map(r => r[metric.key]))) : 0;
  // No qualifying creative has a usable value at all (e.g. Hook/Hold rate on
  // an account with zero video creatives) — that's account-wide "N/A for
  // this metric", a different message than "too small a sample".
  const noData = !best;
  const med = noData ? 0 : median(qualified.map(r => r[metric.key]));
  // Bar length + median marker share one scale: % of the way to the BEST
  // creative in this account on this metric (not an absolute 0-100 axis),
  // so the chart reads as "how close to our own best", same idea for every metric.
  const toPct = v => (!best || !v) ? 0 : (metric.higherBetter ? Math.max(0, Math.min(100, v / best * 100)) : Math.max(0, Math.min(100, best / v * 100)));
  const medPct = med ? toPct(med) : 0;
  const withGrade = rows.map(r => {
    const ok = !noData && metric.minOk(r);
    const val = r[metric.key];
    const ratio = ok && med ? val / med : null;
    const grade = ok && med ? gradeCreative(ratio, metric.higherBetter) : "na";
    const barPct = ok ? Math.max(6, toPct(val)) : 6;
    return {...r, grade, barPct, qualified: ok, noData};
  });
  withGrade.sort((a, b) => {
    const go = GRADE_ORDER[a.grade] - GRADE_ORDER[b.grade];
    if (go !== 0) return go;
    return metric.higherBetter ? (b[metric.key] - a[metric.key]) : ((a[metric.key] || Infinity) - (b[metric.key] || Infinity));
  });
  return {rows: withGrade, med, metric, medPct, noData};
}

function compareVerdict(r, med, metric) {
  if (r.noData) return `Tài khoản này chưa có dữ liệu ${metric.label} phù hợp (vd: không có creative dạng video) — thử chọn metric khác.`;
  if (!r.qualified) return `Chưa đủ điều kiện so sánh ${metric.label} (cần ${metric.minDesc}).`;
  if (!med) return "Chưa đủ creative khác trong tài khoản để so sánh.";
  const val = r[metric.key];
  const diffPct = Math.abs(val - med) / med * 100;
  const dirWord = metric.costLike
    ? (val <= med ? "rẻ hơn" : "đắt hơn")
    : (metric.higherBetter ? (val >= med ? "cao hơn" : "thấp hơn") : (val <= med ? "thấp hơn" : "cao hơn"));
  let action = "";
  if (r.grade === "good") action = " — " + metric.actions.good;
  else if (r.grade === "watch") action = " — " + metric.actions.watch;
  else if (r.grade === "poor") action = " — " + metric.actions.poor;
  let note = "";
  if (metric.key === "cpi" && r.cpi_d != null && r.cpi_d > 40) note = " ⚠ CPI đang tăng nhanh so với kỳ trước.";
  if (metric.key === "ctr" && r.ctr_d != null && r.ctr_d < -25) note = " ⚠ CTR đang giảm so với kỳ trước.";
  return `${metric.label} <b>${metric.val(r)}</b> — ${dirWord} ${diffPct.toFixed(0)}% so với trung vị tài khoản (${metric.med(med)})${action}${note}`;
}

function compareRowHTML(r, med, metric, medPct, rank) {
  const nameLink = r.post_url

  const freq = r.frequency ? freqBadge(r.frequency) : "";
  const medMark = r.qualified && medPct ? `<div class="cmp-med-mark" style="left:${medPct}%" title="Trung vị tài khoản: ${metric.med(med)}"></div>` : "";
  const extraLines = DISPLAY_METRICS.filter(m => compareExtraMetrics.has(m.key))
    .map(m => `<div>${m.label} <b>${m.val(r)}</b></div>`).join("");
  return `<div class="cmp-row grade-${r.grade}">
    <div class="cmp-rank">#${rank}</div>
    <div>
      <div class="cmp-name-line">${nameLink}<span class="cmp-tag">${r.format}</span>${r.ads > 1 ? `<span class="cmp-tag">×${r.ads} ads</span>` : ""}<span class="badge grade-pill ${GRADE_CLASS[r.grade]}">${GRADE_LABEL[r.grade]}</span></div>
      <div class="cmp-bar-track">${medMark}<div class="cmp-bar-fill" style="width:${r.barPct}%"></div></div>
      <div class="cmp-verdict">${compareVerdict(r, med, metric)}</div>

      ${extraLines}

    </div>
  </div>`;
}

function compareHTML(acc) {
  const {rows, med, metric, medPct} = computeCompareRows(acc);

  if (!rows.length) return head + `<div class="cmp-empty">Không có creative nào trong khoảng thời gian này.</div>`;

    + `<div class="cmp-list">` + rows.map((r, i) => compareRowHTML(r, med, metric, medPct, i + 1)).join("") + `</div>`;
}

// Build the insights + format-breakdown + detail-table HTML for one account

  const campToggle = byFormat ? "" :

}

function renderPanel() {
  const tab = DATA.tabs[activeIdx];
  const panel = document.getElementById("panel");
  if (!tab) { panel.innerHTML = ""; return; }

  if (platform === "google") {
    panel.innerHTML = tab.creatives.length
      ? googleAccountPanelHTML(tab)
      : `<div class="panel"><div class="empty">Không có dữ liệu Google cho tài khoản này trong khoảng thời gian đã chọn.</div></div>`;
    return;
  }

  if (platform === "funnel") {
    panel.innerHTML = funnelPanelHTML(tab);
    return;
  }

  if (tab.kind === "campaign") {
    // Campaign report: one shared-theme campaign flowing Brand (awareness) ->
    // App install -> Demand (Drive DAU / DAU-with-lead). Brand stands on its own;
    // App install and Demand each split FB (Meta) vs GG (Google) behind a sub-tab
    // switch so they're compact instead of stacked full-height.
    const note = `<div class="camp-note">📌 <b>${tab.title}</b> — flow: awareness → app install → demand (dùng chung asset/theme). App install & Demand tách FB (Meta) vs GG (Google):</div>`;

    const brand = tab.sections.find(s => s.phase === "brand");
    const appFb = tab.sections.find(s => s.phase === "app" && s.platform === "meta");
    const appGg = tab.sections.find(s => s.phase === "app" && s.platform === "google");
    const demFb = tab.sections.find(s => s.phase === "demand" && s.channel === "FB");
    const demGg = tab.sections.find(s => s.phase === "demand" && s.channel === "GG");

    // A section's detail body (Meta creatives / Google ad groups / Demand
    // campaigns), or an empty note.
    const bodyOf = s => {
      if (!s || !s.creatives.length)
        return `<div class="panel"><div class="empty">Không có ${s && (s.platform === "google" || s.platform === "demand") ? "campaign" : "creative"} nào khớp trong khoảng thời gian này.</div></div>`;
      if (s.platform === "demand") return demandPanelHTML(s);
      return s.platform === "google"
        ? googleAccountPanelHTML({label: s.label, creatives: s.creatives})
        : accountPanelHTML({label: s.label, group: s.group, creatives: s.creatives});
    };

    // A phase (App install / Demand) with FB / GG sub-tabs.
    const phaseBlock = (title, fb, gg, cur, setter) => {
      const active = cur === "google" ? gg : fb;
      const subtabs = `<div class="sec-head" style="justify-content:space-between">`
        + `<b>${title}</b>`
        + `<div style="display:flex;gap:8px">`
        + `<button class="ctl${cur === "meta" ? " active" : ""}" onclick="${setter}('meta')">FB · ${fb ? fb.creatives.length : 0}</button>`
        + `<button class="ctl${cur === "google" ? " active" : ""}" onclick="${setter}('google')">GG · ${gg ? gg.creatives.length : 0}</button>`
        + `</div></div>`;
      return `<div class="camp-sec">${subtabs}${bodyOf(active)}</div>`;
    };

    const brandBlock = brand
      ? `<div class="camp-sec"><div class="sec-head"><b>Brand — Awareness</b><span>${brand.creatives.length} creatives</span></div>${bodyOf(brand)}</div>`
      : "";
    const appBlock = phaseBlock("App install", appFb, appGg, campAppTab, "setCampAppTab");
    const demandBlock = phaseBlock("Demand — Drive DAU / DAU with lead", demFb, demGg, campDemandTab, "setCampDemandTab");

    panel.innerHTML = note + brandBlock + appBlock + demandBlock;
    return;
  }

  panel.innerHTML = accountPanelHTML(tab);
}

function buildCampaignTabs(accounts) {
  // Flatten Meta creatives, tagging each with its account label + group.
  const flat = [];
  accounts.forEach(a => a.creatives.forEach(c =>
    flat.push({...c, _acct: a.label, _group: (a.group || "").toUpperCase()})));
  const has = (c, kw) => (c.campaign || "").toLowerCase().includes(kw.toLowerCase());
  const eqAny = (c, names) => names.some(n => (c.campaign || "").toLowerCase() === n.toLowerCase());
  // Google ad-group rows for the current window (VND-native). App install lives
  // in the app_pty account (keyword match); Demand lives in the PTY_DAU_New
  // account (exact campaign-name match — that account holds many campaigns).
  const gw = GG ? ggWindow(curRange) : new Map();
  const ggAppFlat = GG ? (gw.get(GG_APP_ACCT) || []) : [];
  const ggHas = (r, kw) => (r.campaign || "").toLowerCase().includes(kw.toLowerCase());
  // Demand rows come from demand_data.json (raw_retention: campaign-level, lead/
  // DAU, both channels). Filter each section by channel + exact campaign name;
  // Demand FB additionally supports a keyword (Thổ Địa = one campaign).
  const demRows = DEM ? demandWindow(curRange) : [];
  const eqAnyR = (r, names) => (names || []).some(n => (r.campaign || "").toLowerCase() === n.toLowerCase());
  const demFbMatch = (r, def) => def.demandFbCamps
    ? eqAnyR(r, def.demandFbCamps)
    : (def.demandFbKw ? (r.campaign || "").toLowerCase().includes(def.demandFbKw.toLowerCase()) : false);
  return CAMPAIGN_DEFS.map(def => ({
    kind: "campaign",
    label: def.tab,
    title: def.title,
    sections: [

// ========================================================================
// GOOGLE ADS view. Data = docs/data/google_data.json (cost/impr/clicks from a
// team Google Sheet, installs from Airbridge Channel='google.adwords'). Native
// VND (no SGD conversion). Level = campaign -> ad group: each row is one ad
// group within one campaign. Sums each preset's today-relative window with the
// SAME abWindow() logic as the Airbridge Meta override, so windows line up.
// ========================================================================
const GCOLS = [
  {k: "campaign", label: "Campaign"},
  {k: "name", label: "Ad group"},
  {k: "spend", label: "Spend (₫)", f: fmtVnd},
  {k: "installs", label: "Installs", f: fmtDash(fmtInt)},
  {k: "cpi", label: "CPI (₫)", f: fmtDash(fmtVnd), d: "cpi_d", goodDown: true},
  {k: "impressions", label: "Impr.", f: fmtInt},
  {k: "clicks", label: "Clicks", f: fmtInt},
  {k: "ctr", label: "CTR", f: fmtPct, d: "ctr_d", goodDown: false},
  {k: "cpc", label: "CPC (₫)", f: fmtDash(fmtVnd)},
  {k: "cpm", label: "CPM (₫)", f: fmtDash(fmtVnd)},
];

// Sum google_data.by_day over [since, until] -> Map<cid_agid, [cost,impr,clk,ins]>.
function ggAgg(since, until) {
  const agg = new Map();
  for (const day in GG.by_day) {
    if (day < since || day > until) continue;
    const m = GG.by_day[day];
    for (const k in m) {
      const v = m[k], t = agg.get(k) || [0, 0, 0, 0];
      t[0] += v[0]; t[1] += v[1]; t[2] += v[2]; t[3] += v[3];
      agg.set(k, t);
    }
  }
  return agg;
}

// Build per-account ad-group rows for `key`, with ctr_d/cpi_d deltas vs the
// immediately-preceding equal-length window (same abWindow/abPrevWindow logic
// as the Meta side). Returns Map<account, ad-group-row[]>.
function ggWindow(key) {
  const cur = abWindow(key), prev = abPrevWindow(key);
  const agg = ggAgg(cur.since, cur.until);
  const pagg = prev ? ggAgg(prev.since, prev.until) : null;
  const byAcct = new Map();
  agg.forEach((v, k) => {
    const d = GG.dims[k]; if (!d) return;
    const [cost, impr, clk, ins] = v;
    if (!(cost || impr || clk || ins)) return;
    const ctr = impr ? clk / impr * 100 : 0, cpi = ins ? cost / ins : 0;
    const p = pagg ? pagg.get(k) : null;
    const dd = deltas(ctr, cpi, p ? p[1] : 0, p ? p[2] : 0, p ? p[0] : 0, p ? p[3] : 0);
    const row = {
      name: d.ag || "—", campaign: d.camp || "—", ads: 1,
      spend: cost, impressions: impr, clicks: clk, installs: ins,
      ctr, cpc: clk ? cost / clk : 0, cpm: impr ? cost / impr * 1000 : 0, cpi,
      ...dd,
    };
    if (!byAcct.has(d.acct)) byAcct.set(d.acct, []);
    byAcct.get(d.acct).push(row);
  });
  return byAcct;
}

function ggTotals(creatives) {
  const t = {spend: 0, impressions: 0, clicks: 0, installs: 0};
  creatives.forEach(c => { t.spend += c.spend; t.impressions += c.impressions; t.clicks += c.clicks; t.installs += c.installs; });
  t.ctr = t.impressions ? t.clicks / t.impressions * 100 : 0;
  t.cpi = t.installs ? t.spend / t.installs : 0;
  t.count = creatives.length;
  return t;
}

function renderGoogleCards() {
  const g = {spend: 0, impressions: 0, clicks: 0, installs: 0, count: 0};
  DATA.accounts.forEach(a => { const t = ggTotals(a.creatives); g.spend += t.spend; g.impressions += t.impressions; g.clicks += t.clicks; g.installs += t.installs; g.count += t.count; });
  const avgCtr = g.impressions ? g.clicks / g.impressions * 100 : 0;
  const cpi = g.installs ? g.spend / g.installs : 0;
  const cards = [
    {k: "Total Spend", v: fmtVnd(g.spend)},
    {k: "Impressions", v: fmtInt(g.impressions)},
    {k: "Clicks", v: fmtInt(g.clicks)},
    {k: "Avg CTR", v: fmtPct(avgCtr)},
    {k: "Installs · Airbridge", v: g.installs ? fmtInt(g.installs) : "–"},
    {k: "Avg CPI", v: cpi ? fmtVnd(cpi) : "–"},
    {k: "Ad groups", v: fmtInt(g.count) + " · " + DATA.accounts.length + " acc"},
  ];
  document.getElementById("cards").innerHTML = cards.map(c =>
    `<div class="card"><div class="k">${c.k}</div><div class="v ${c.accent ? "accent" : ""}">${c.v}</div></div>`
  ).join("");
}

function computeGoogleInsights() {
  const all = [];
  DATA.accounts.forEach(a => a.creatives.forEach(c => all.push({...c, account: a.label})));
  if (!all.length) return [];
  const sum = k => all.reduce((s, c) => s + (c[k] || 0), 0);
  const spend = sum("spend"), installs = sum("installs"), impr = sum("impressions"), clicks = sum("clicks");
  const ctr = impr ? clicks / impr * 100 : 0, cpi = installs ? spend / installs : 0;
  const out = [];
  out.push(`<b>${fmtInt(all.length)}</b> ad groups across <b>${DATA.accounts.length}</b> accounts · Spend <b>${fmtVnd(spend)}</b>`
    + (installs ? ` · <b>${fmtInt(installs)}</b> installs @ CPI ${fmtVnd(cpi)}` : "") + ` · Avg CTR ${fmtPct(ctr)}.`);
  // Top account by spend
  const accs = DATA.accounts.map(a => ({label: a.label, ...ggTotals(a.creatives)})).sort((x, y) => y.spend - x.spend);
  if (accs.length) {
    const lead = accs[0];
    out.push(`Top account by spend: <b>${lead.label}</b> — ${fmtVnd(lead.spend)} `
      + `(${spend ? Math.round(lead.spend / spend * 100) : 0}% of spend`
      + (lead.installs ? `, ${fmtInt(lead.installs)} installs @ CPI ${fmtVnd(lead.cpi)}` : "") + ").");
  }
  // Best / worst CPI ad group (min 20 installs to avoid noise)
  const cand = all.filter(c => c.installs >= 20);
  if (cand.length) {
    const best = cand.slice().sort((a, b) => a.cpi - b.cpi)[0];
    out.push(`Best CPI: <b>${best.name}</b> (${best.account} · ${best.campaign}) — ${fmtVnd(best.cpi)} on ${fmtInt(best.installs)} installs.`);
    const worst = cand.slice().sort((a, b) => b.cpi - a.cpi)[0];
    if (worst !== best) out.push({warn: true, html: `Worst CPI: <b>${worst.name}</b> (${worst.account} · ${worst.campaign}) — ${fmtVnd(worst.cpi)} on ${fmtInt(worst.installs)} installs, spend ${fmtVnd(worst.spend)}.`});
  }
  return out;
}

function renderGoogleInsights() {
  const box = document.getElementById("insights");
  const rows = computeGoogleInsights();
  if (!rows.length) { box.style.display = "none"; return; }
  const period = (RANGES[curRange] && RANGES[curRange].period_label) || "";
  box.style.display = "";
  box.innerHTML = `<div class="ins-head">💡 KEY INSIGHTS · GOOGLE ADS${period ? " — " + period.toUpperCase() : ""}</div>`
    + rows.map(r => typeof r === "string" ? `<div class="ins-row">${r}</div>` : `<div class="ins-row warn">${r.html}</div>`).join("");
}

// Per-account insights for a Google account (CPI focus — these are install/DAU buys).
function computeGoogleAccountInsights(acc) {
  const all = acc.creatives;
  if (!all.length) return [];
  const t = ggTotals(all);
  const out = [];
  out.push(`<b>${all.length}</b> ad groups · Spend <b>${fmtVnd(t.spend)}</b>`
    + (t.installs ? ` · <b>${fmtInt(t.installs)}</b> installs @ CPI <b>${fmtVnd(t.cpi)}</b>` : " · no installs tracked")
    + ` · CTR ${fmtPct(t.ctr)}.`);
  const cand = all.filter(c => c.installs >= 10);
  if (cand.length) {
    const best = cand.slice().sort((a, b) => a.cpi - b.cpi)[0];
    out.push(`Best CPI: <b>${best.name}</b> (${best.campaign}) — ${fmtVnd(best.cpi)} on ${fmtInt(best.installs)} installs (CTR ${fmtPct(best.ctr)}).`);
    const worst = cand.slice().sort((a, b) => b.cpi - a.cpi)[0];
    if (worst !== best) out.push({warn: true, html: `Worst CPI: <b>${worst.name}</b> (${worst.campaign}) — ${fmtVnd(worst.cpi)} on ${fmtInt(worst.installs)} installs, spend ${fmtVnd(worst.spend)}.`});
  }
  const ts = all.slice().sort((a, b) => b.spend - a.spend)[0];
  out.push(`Highest spend: <b>${ts.name}</b> (${ts.campaign}) — ${fmtVnd(ts.spend)}`
    + (ts.installs ? `, CPI ${fmtVnd(ts.cpi)}` : "") + `, CTR ${fmtPct(ts.ctr)}.`);
  return out;
}

    minOk: r => (r.impressions || 0) >= 500, minDesc: "tối thiểu 500 lượt hiển thị",
    val: r => fmtInt(r.clicks), med: m => fmtInt(Math.round(m)),
    actions: {good: "đang thu hút nhiều click nhất, đáng tham khảo nhân rộng.", watch: "số lượt click ở mức trung bình.", poor: "số lượt click thấp hơn hẳn — nên xem lại từ khóa/quảng cáo."}},

    val: r => fmtPct(r.ctr), med: m => fmtPct(m),
    actions: {good: "hiệu quả thu hút click tốt, đáng tham khảo nhân rộng.", watch: "theo dõi thêm, chưa cần thay ngay.", poor: "CTR thấp — nên xem lại từ khóa/quảng cáo."}},

    minOk: r => (r.impressions || 0) >= 500, minDesc: "tối thiểu 500 lượt hiển thị",
    val: r => fmtVnd(r.cpc), med: m => fmtVnd(m),
    actions: {good: "chi phí mỗi click thấp, hiệu quả — đáng cân nhắc tăng ngân sách.", watch: "theo dõi thêm, chưa cần thay ngay.", poor: "chi phí mỗi click cao — nên xem lại từ khóa/quảng cáo."}},

};
const GG_METRIC_OPTS = [["spend", "Spend"], ["installs", "Installs"], ["cpi", "CPI"], ["impressions", "Impressions"], ["clicks", "Clicks"], ["ctr", "CTR"], ["cpc", "CPC"], ["cpm", "CPM"]];
let ggCompareMetric = "cpi";
function setGgCompareMetric(k) { ggCompareMetric = k; renderPanel(); }

const GG_DISPLAY_METRICS = [
  {key: "cpi", label: "CPI (₫)", val: r => r.cpi ? fmtVnd(r.cpi) : "–"},
  {key: "ctr", label: "CTR", val: r => fmtPct(r.ctr)},
];
let ggCompareExtras = new Set(["cpi", "ctr"]);
function toggleGgExtra(k) { if (ggCompareExtras.has(k)) ggCompareExtras.delete(k); else ggCompareExtras.add(k); renderPanel(); }

function ggComputeCompareRows(rows) {
  const metric = GG_METRICS[ggCompareMetric];
  const qualified = rows.filter(metric.minOk);
  const best = qualified.length ? (metric.higherBetter ? Math.max(...qualified.map(r => r[metric.key])) : Math.min(...qualified.map(r => r[metric.key]))) : 0;
  const noData = !best;
  const med = noData ? 0 : median(qualified.map(r => r[metric.key]));
  const toPct = v => (!best || !v) ? 0 : (metric.higherBetter ? Math.max(0, Math.min(100, v / best * 100)) : Math.max(0, Math.min(100, best / v * 100)));
  const medPct = med ? toPct(med) : 0;
  const withGrade = rows.map(r => {
    const ok = !noData && metric.minOk(r);
    const val = r[metric.key];
    const ratio = ok && med ? val / med : null;
    const grade = ok && med ? gradeCreative(ratio, metric.higherBetter) : "na";
    const barPct = ok ? Math.max(6, toPct(val)) : 6;
    return {...r, grade, barPct, qualified: ok, noData};
  });
  withGrade.sort((a, b) => {
    const go = GRADE_ORDER[a.grade] - GRADE_ORDER[b.grade];
    if (go !== 0) return go;
    return metric.higherBetter ? (b[metric.key] - a[metric.key]) : ((a[metric.key] || Infinity) - (b[metric.key] || Infinity));
  });
  return {rows: withGrade, med, metric, medPct};
}

function ggCompareVerdict(r, med, metric) {
  if (r.noData) return `Tài khoản này chưa có dữ liệu ${metric.label} phù hợp — thử chọn metric khác.`;
  if (!r.qualified) return `Chưa đủ điều kiện so sánh ${metric.label} (cần ${metric.minDesc}).`;
  if (!med) return "Chưa đủ ad group khác trong tài khoản để so sánh.";
  const val = r[metric.key];
  const diffPct = Math.abs(val - med) / med * 100;
  const dirWord = metric.costLike
    ? (val <= med ? "rẻ hơn" : "đắt hơn")
    : (metric.higherBetter ? (val >= med ? "cao hơn" : "thấp hơn") : (val <= med ? "thấp hơn" : "cao hơn"));
  let action = "";
  if (r.grade === "good") action = " — " + metric.actions.good;
  else if (r.grade === "watch") action = " — " + metric.actions.watch;
  else if (r.grade === "poor") action = " — " + metric.actions.poor;
  let note = "";
  if (metric.key === "cpi" && r.cpi_d != null && r.cpi_d > 40) note = " ⚠ CPI đang tăng nhanh so với kỳ trước.";
  if (metric.key === "ctr" && r.ctr_d != null && r.ctr_d < -25) note = " ⚠ CTR đang giảm so với kỳ trước.";
  return `${metric.label} <b>${metric.val(r)}</b> — ${dirWord} ${diffPct.toFixed(0)}% so với trung vị tài khoản (${metric.med(med)})${action}${note}`;
}

function ggCompareRowHTML(r, med, metric, medPct, rank) {
  const medMark = r.qualified && medPct ? `<div class="cmp-med-mark" style="left:${medPct}%" title="Trung vị tài khoản: ${metric.med(med)}"></div>` : "";
  const extraLines = GG_DISPLAY_METRICS.filter(m => ggCompareExtras.has(m.key)).map(m => `<div>${m.label} <b>${m.val(r)}</b></div>`).join("");
  return `<div class="cmp-row grade-${r.grade}">
    <div class="cmp-rank">#${rank}</div>
    <div>
      <div class="cmp-name-line"><span>${r.name}</span><span class="cmp-tag">${r.campaign}</span><span class="badge grade-pill ${GRADE_CLASS[r.grade]}">${GRADE_LABEL[r.grade]}</span></div>
      <div class="cmp-bar-track">${medMark}<div class="cmp-bar-fill" style="width:${r.barPct}%"></div></div>
      <div class="cmp-verdict">${ggCompareVerdict(r, med, metric)}</div>
    </div>
    <div class="cmp-stats-col">${extraLines}</div>
  </div>`;
}

function ggMetricSwitcherHTML(current) {
  return `<div class="controls" style="margin:0 0 12px">
    <span class="ctl-label">So sánh theo:</span>
    ${GG_METRIC_OPTS.map(([k, l]) => `<button class="ctl${current === k ? " active" : ""}" onclick="setGgCompareMetric('${k}')">${l}</button>`).join("")}

function ggExtraMetricSwitcherHTML() {
  return `<div class="controls" style="margin:0 0 12px;flex-wrap:wrap">

function ggCompareLegendHTML(metric) {
  return `<div class="cmp-legend">
    Xếp hạng theo <b>${metric.label}</b> (${metric.unitDesc}) so với <b>trung vị</b> của các ad group khác trong tài khoản này (cùng khoảng thời gian) — ${metric.minDesc} để đủ tin cậy. Vạch đứng trên thanh = mức trung vị.<br>

    <span class="badge grade-pill f-amber">Cần chú ý</span> kém hơn, nên theo dõi

    <span class="badge grade-pill f-grey">Chưa đủ dữ liệu</span> mẫu quá nhỏ để đánh giá
  </div>`;
}
function ggCompareHTML(rows) {
  const {rows: graded, med, metric, medPct} = ggComputeCompareRows(rows);
  const head = ggMetricSwitcherHTML(ggCompareMetric) + ggExtraMetricSwitcherHTML();
  if (!graded.length) return head + `<div class="cmp-empty">Không có ad group nào trong khoảng thời gian này.</div>`;
  return head + ggCompareLegendHTML(metric)
    + `<div class="cmp-list">` + graded.map((r, i) => ggCompareRowHTML(r, med, metric, medPct, i + 1)).join("") + `</div>`;
}

// DEMAND view. Data = docs/data/demand_data.json (from the Google Sheet tab
// "raw_retention"; campaign-level, VND-native, BOTH FB and GG channels). Demand
// campaigns are LEAD / DAU buys (not installs) — the PMax ones aren't in the
// creative sheet at all. Level = campaign (no ad group / no ID). Sums each
// preset's today-relative window with the SAME abWindow() logic as the others.
// ========================================================================
const DCOLS = [
  {k: "campaign", label: "Campaign"},
  {k: "spend", label: "Cost (₫)", f: fmtVnd},
  {k: "impressions", label: "Impr.", f: fmtInt},
  {k: "clicks", label: "Clicks", f: fmtInt},
  {k: "ctr", label: "CTR", f: fmtPct, d: "ctr_d", goodDown: false},
  {k: "lead", label: "Lead", f: fmtDash(fmtInt)},
  {k: "cpl", label: "CPL (₫)", f: fmtDash(fmtVnd), d: "cpl_d", goodDown: true},
  {k: "dwl", label: "DWL", f: fmtDash(fmtInt)},
  {k: "dau", label: "DAU", f: fmtDash(fmtInt)},
  // Add-on secondary metric: installs these DAU/lead buys still drove (Airbridge).
  {k: "installs", label: "Install", f: fmtDash(fmtInt)},
  {k: "cpi", label: "CPI (₫)", f: fmtDash(fmtVnd), d: "cpi_d", goodDown: true},
];

// Sum demand_data.by_day over [since, until] -> Map<key, [cost,impr,clk,lead,dwl,dau,installs]>.
function demAgg(since, until) {
  const agg = new Map();
  if (!DEM || !DEM.by_day) return agg;
  for (const day in DEM.by_day) {
    if (day < since || day > until) continue;
    const m = DEM.by_day[day];
    for (const k in m) {
      const v = m[k], t = agg.get(k) || [0, 0, 0, 0, 0, 0, 0];
      for (let i = 0; i < v.length; i++) t[i] += v[i];
      agg.set(k, t);
    }
  }
  return agg;
}

// Campaign rows for `key`, with ctr_d/cpl_d deltas vs the immediately-preceding
// equal-length window. Returns a flat array (all demand campaigns, both channels).
function demandWindow(key) {
  const cur = abWindow(key), prev = abPrevWindow(key);
  const agg = demAgg(cur.since, cur.until);
  const pagg = prev ? demAgg(prev.since, prev.until) : null;
  const rows = [];
  agg.forEach((v, k) => {
    const dim = DEM.dims[k]; if (!dim) return;
    const [cost, impr, clk, lead, dwl, dau, installs = 0] = v;
    if (!(cost || impr || clk || lead || installs)) return;
    const ctr = impr ? clk / impr * 100 : 0, cpl = lead ? cost / lead : 0;
    const cpi = installs ? cost / installs : 0;
    const p = pagg ? pagg.get(k) : null;
    const pCtr = p && p[1] ? p[2] / p[1] * 100 : 0;
    const pCpl = p && p[3] ? p[0] / p[3] : 0;
    const pCpi = p && p[6] ? p[0] / p[6] : 0;
    rows.push({
      name: dim.campaign, campaign: dim.campaign, channel: dim.channel, ads: 1,
      spend: cost, impressions: impr, clicks: clk, lead, dwl, dau, installs, ctr, cpl, cpi,
      ctr_d: pCtr ? (ctr - pCtr) / pCtr * 100 : null,
      cpl_d: pCpl ? (cpl - pCpl) / pCpl * 100 : null,
      cpi_d: pCpi ? (cpi - pCpi) / pCpi * 100 : null,
    });
  });
  return rows;
}

function demTotals(rows) {
  const t = {spend: 0, impressions: 0, clicks: 0, lead: 0, dwl: 0, dau: 0, installs: 0};
  rows.forEach(r => { t.spend += r.spend; t.impressions += r.impressions; t.clicks += r.clicks; t.lead += r.lead; t.dwl += r.dwl; t.dau += r.dau; t.installs += (r.installs || 0); });
  t.ctr = t.impressions ? t.clicks / t.impressions * 100 : 0;
  t.cpl = t.lead ? t.spend / t.lead : 0;
  t.cpi = t.installs ? t.spend / t.installs : 0;
  t.count = rows.length;
  return t;
}

// Per-section demand insights (Lead / CPL focus — these are lead/DAU buys).
function computeDemandInsights(label, rows, t) {
  if (!rows.length) return [];
  const out = [];
  out.push(`<b>${rows.length}</b> campaigns · Cost <b>${fmtVnd(t.spend)}</b>`
    + (t.lead ? ` · <b>${fmtInt(t.lead)}</b> leads @ CPL <b>${fmtVnd(t.cpl)}</b>` : " · no leads tracked")
    + ` · CTR ${fmtPct(t.ctr)}.`);
  if (t.installs) out.push(`Add-on: các buy DAU/lead này còn kéo <b>${fmtInt(t.installs)}</b> installs (Airbridge) @ CPI <b>${fmtVnd(t.cpi)}</b>.`);
  const cand = rows.filter(c => c.lead >= 20);
  if (cand.length) {
    const best = cand.slice().sort((a, b) => a.cpl - b.cpl)[0];
    out.push(`Best CPL: <b>${best.campaign}</b> — ${fmtVnd(best.cpl)} on ${fmtInt(best.lead)} leads (CTR ${fmtPct(best.ctr)}).`);
    const worst = cand.slice().sort((a, b) => b.cpl - a.cpl)[0];
    if (worst !== best) out.push({warn: true, html: `Worst CPL: <b>${worst.campaign}</b> — ${fmtVnd(worst.cpl)} on ${fmtInt(worst.lead)} leads, cost ${fmtVnd(worst.spend)}.`});
  }
  const ts = rows.slice().sort((a, b) => b.spend - a.spend)[0];
  out.push(`Highest cost: <b>${ts.campaign}</b> — ${fmtVnd(ts.spend)}`
    + (ts.lead ? `, CPL ${fmtVnd(ts.cpl)}` : "") + `, CTR ${fmtPct(ts.ctr)}.`);
  return out;
}

function sumKnown(rows, key) {
  const values = rows.map(r => r[key]).filter(v => v !== null && v !== undefined && v !== "");
  return values.length ? values.reduce((s, v) => s + Number(v || 0), 0) : null;
}

function funnelWindow(key, vertical) {
  if (!FNL || !FNL.rows) return [];
  const w = abWindow(key), groups = new Map();
  // Placeholder attribution buckets are retained in the source JSON for QA,
  // but are not useful in the creative comparison table.
  FNL.rows.filter(r => r.date >= w.since && r.date <= w.until && (vertical === "ALL" || r.vertical === vertical)
    && (fnlChannel === "ALL" || r.ad_platform === fnlChannel)
    && !["APP_NOT_CAPTURABLE", "UNMATCHED_NO_UTM_CONTENT"].includes(r.utm_content)
    && Number(r.spend_vnd || 0) > 0).forEach(r => {
    const k = [r.vertical, r.ad_platform, r.utm_campaign, r.utm_content, r.match_status].join("|");
    const a = groups.get(k) || [];
    a.push(r); groups.set(k, a);
  });
  return [...groups.entries()].map(([k, rs]) => {
    const [vertical, platform, campaign, name, match_status] = k.split("|");
    const spend = sumKnown(rs, "spend_vnd"), impressions = sumKnown(rs, "impressions"), clicks = sumKnown(rs, "clicks");
    const mature = rs.filter(r => r.is_mature_cohort);
    const dwl = sumKnown(mature, "dwl_14d"), lead = sumKnown(mature, "lead_14d");
    // "All cohorts" DWL/lead include recent, not-yet-mature cohorts (undercounts
    // eventual conversions, since a 14-day window hasn't closed yet) -- shown
    // alongside the mature figures so recent windows aren't all blank dashes.
    const dwlAll = sumKnown(rs, "dwl_14d"), leadAll = sumKnown(rs, "lead_14d");
    return {vertical, platform, campaign, name, match_status, spend, impressions, clicks,
      dau: sumKnown(rs, "dau"), dwa: sumKnown(rs, "dwa"), dwl, lead, dwlAll, leadAll,
      ctr: impressions ? clicks / impressions * 100 : null,
      cpdwl: spend && dwl ? spend / dwl : null};
  });
}

function funnelTotals(rows) {
  const spend = sumKnown(rows, "spend"), impressions = sumKnown(rows, "impressions"), clicks = sumKnown(rows, "clicks");
  const dwl = sumKnown(rows, "dwl"), lead = sumKnown(rows, "lead");
  const dwlAll = sumKnown(rows, "dwlAll"), leadAll = sumKnown(rows, "leadAll");
  return {spend, impressions, clicks, dwl, lead, dwlAll, leadAll, dau: sumKnown(rows, "dau"), dwa: sumKnown(rows, "dwa"),
    ctr: impressions ? clicks / impressions * 100 : null, cpdwl: spend && dwl ? spend / dwl : null};
}

const FNL_METRIC_OPTS = [["spend", "Spend"], ["dau", "DAU"], ["dwa", "DWA"], ["dwl", "DWL"], ["lead", "Lead"], ["ctr", "CTR"], ["cpdwl", "CP-DWL"]];

function toggleFnlExtra(k) { if (fnlCompareExtras.has(k)) fnlCompareExtras.delete(k); else fnlCompareExtras.add(k); renderPanel(); }

function fnlComputeCompareRows(rows) {
  const metric = FNL_METRICS[fnlCompareMetric];
  const qualified = rows.filter(metric.minOk);
  const best = qualified.length ? (metric.higherBetter ? Math.max(...qualified.map(r => r[metric.key])) : Math.min(...qualified.map(r => r[metric.key]))) : 0;
  const noData = !best;
  const med = noData ? 0 : median(qualified.map(r => r[metric.key]));
  const toPct = v => (!best || !v) ? 0 : (metric.higherBetter ? Math.max(0, Math.min(100, v / best * 100)) : Math.max(0, Math.min(100, best / v * 100)));
  const medPct = med ? toPct(med) : 0;
  const withGrade = rows.map(r => {
    const ok = !noData && metric.minOk(r);
    const val = r[metric.key];
    const ratio = ok && med ? val / med : null;
    const grade = ok && med ? gradeCreative(ratio, metric.higherBetter) : "na";
    const barPct = ok ? Math.max(6, toPct(val)) : 6;
    return {...r, grade, barPct, qualified: ok, noData};
  });
  withGrade.sort((a, b) => {
    const go = GRADE_ORDER[a.grade] - GRADE_ORDER[b.grade];
    if (go !== 0) return go;
    return metric.higherBetter ? ((b[metric.key] || 0) - (a[metric.key] || 0)) : ((a[metric.key] || Infinity) - (b[metric.key] || Infinity));
  });
  return {rows: withGrade, med, metric, medPct};
}

function fnlCompareVerdict(r, med, metric) {
  if (r.noData) return `Chưa có dữ liệu ${metric.label} phù hợp trong lát cắt này — thử chọn metric khác.`;
  if (!r.qualified) return `Chưa đủ điều kiện so sánh ${metric.label} (cần ${metric.minDesc}).`;
  if (!med) return "Chưa đủ dòng khác trong lát cắt này để so sánh.";
  const val = r[metric.key];
  const diffPct = Math.abs(val - med) / med * 100;
  const dirWord = metric.costLike
    ? (val <= med ? "rẻ hơn" : "đắt hơn")
    : (metric.higherBetter ? (val >= med ? "cao hơn" : "thấp hơn") : (val <= med ? "thấp hơn" : "cao hơn"));
  let action = "";
  if (r.grade === "good") action = " — " + metric.actions.good;
  else if (r.grade === "watch") action = " — " + metric.actions.watch;
  else if (r.grade === "poor") action = " — " + metric.actions.poor;
  return `${metric.label} <b>${metric.val(r)}</b> — ${dirWord} ${diffPct.toFixed(0)}% so với trung vị (${metric.med(med)})${action}`;
}
