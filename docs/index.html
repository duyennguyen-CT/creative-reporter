}
function fnlCompareLegendHTML(metric) {
  return `<div class="cmp-legend">
    Xếp hạng theo <b>${metric.label}</b> (${metric.unitDesc}) so với <b>trung vị</b> của các dòng khác trong lát cắt này (cùng khoảng thời gian, cùng vertical/channel đang chọn) — ${metric.minDesc} để đủ tin cậy. Vạch đứng trên thanh = mức trung vị.<br>
    <span class="badge grade-pill f-green">Tốt</span> hiệu quả rõ rệt hơn mức chung
    <span class="badge grade-pill f-blue">Khá</span> xấp xỉ mức chung
    <span class="badge grade-pill f-amber">Cần chú ý</span> kém hơn, nên theo dõi
    <span class="badge grade-pill f-red">Kém</span> nên xem xét đổi/tắt
    <span class="badge grade-pill f-grey">Chưa đủ dữ liệu</span> mẫu quá nhỏ để đánh giá
  </div>`;
}
function fnlCompareHTML(rows) {
  const {rows: graded, med, metric, medPct} = fnlComputeCompareRows(rows);
  const head = fnlMetricSwitcherHTML(fnlCompareMetric) + fnlExtraMetricSwitcherHTML();
  if (!graded.length) return head + `<div class="cmp-empty">Không có dòng nào trong khoảng thời gian này.</div>`;
  return head + fnlCompareLegendHTML(metric)
    + `<div class="cmp-list">` + graded.map((r, i) => fnlCompareRowHTML(r, med, metric, medPct, i + 1)).join("") + `</div>`;
}

function funnelPanelHTML(tab) {
  const rows = funnelWindow(curRange, tab.vertical).sort((a, b) => (b.spend || 0) - (a.spend || 0));
  const t = funnelTotals(rows);
  if (!rows.length) return `<div class="panel"><div class="empty">No Google Creative Funnel data is loaded for this period yet.</div></div>`;
  const note = `<div class="camp-note">📌 Showing Google asset groups + Meta ads with positive spend only. “Mature 14d” excludes recent cohorts that have not had a full 14-day lead window. VEH Meta rows have no cost source yet, so they won't appear here (spend filter) — see the vertical tab for funnel-only rows. Source data retains unattributed and zero-spend rows for QA.</div>`;
  if (subViewMode === "compare") {
    return note + `<div class="panel"><div class="panel-head"><b>${tab.label}</b><span>Spend ${fmtDash(fmtVnd)(t.spend)}</span><span>DAU ${fmtDash(fmtInt)(t.dau)}</span><span>DWL ${fmtDash(fmtInt)(t.dwl)}</span></div>`
      + `<div style="padding:16px 18px">${fnlCompareHTML(rows)}</div></div>`;
  }
  return note
    + `<div class="panel"><div class="panel-head"><b>${tab.label}</b><span>Spend ${fmtDash(fmtVnd)(t.spend)}</span><span>DAU ${fmtDash(fmtInt)(t.dau)}</span><span>DWL ${fmtDash(fmtInt)(t.dwl)}</span><span>${rows.length} rows</span></div>${tableHTML(rows, FCOLS, true)}</div>`;
}

function applyRangeFunnel(key) {
  curRange = key;
  const verticals = ["ALL", "PTY", "JOB", "VEH", "GDS"].filter(v => v === "ALL" || (FNL && FNL.rows || []).some(r => r.vertical === v));
  DATA = {tabs: verticals.map(v => ({kind: "funnel", vertical: v, label: v === "ALL" ? "All verticals" : v, group: ""}))};
  activeIdx = Math.min(Math.max(activeIdx, 0), DATA.tabs.length - 1);
  document.getElementById("period").textContent = RANGES[key].period_label || "";
  document.getElementById("generated").textContent = "Funnel data through: " + (FNL.data_through || "—");
  document.getElementById("foot").textContent = "Google PMax asset-group cost + Meta ad cost, both joined to warehouse cohorts · DWL and CP-DWL use mature 14-day cohorts only · VEH Meta rows show funnel numbers only, no cost source yet.";
  document.getElementById("insights").style.display = "none";
  renderFunnelCards(); renderTabs(); renderControls(); renderPanel();
}

function applyRangeGoogle(key) {
  curRange = key;
  const byAcct = ggWindow(key);
  DATA = {accounts: GG.accounts.map(a => ({kind: "account", label: a.name, group: (a.phase || "").toUpperCase(), creatives: byAcct.get(a.name) || []}))};
  DATA.tabs = DATA.accounts;
  activeIdx = Math.min(Math.max(activeIdx, 0), DATA.tabs.length - 1);
  document.getElementById("period").textContent = RANGES[key].period_label || "";
  document.getElementById("insights").style.display = "none";  // top summary removed; per-account insights only
  renderGoogleCards(); renderTabs(); renderControls(); renderPanel();
}

function switchPlatform(p) {
  if (p === platform || (p === "google" && !GG) || (p === "funnel" && !FNL)) return;
  platform = p;
  activeIdx = 0; sortKey = "spend"; sortDir = -1; viewMode = "compare"; showCampaign = false; fnlChannel = "ALL"; compareMetric = null; compareExtraMetrics = new Set(["cpi", "ctr"]);
  subViewMode = "compare"; ggCompareMetric = "cpi"; ggCompareExtras = new Set(["cpi", "ctr"]); fnlCompareMetric = "cpdwl"; fnlCompareExtras = new Set(["ctr", "cpdwl"]);
  document.getElementById("pf-meta").className = "pf" + (p === "meta" ? " active" : "");
  document.getElementById("pf-google").className = "pf" + (p === "google" ? " active" : "");
  document.getElementById("pf-funnel").className = "pf" + (p === "funnel" ? " active" : "");
  document.getElementById("pf-campaign").className = "pf" + (p === "campaign" ? " active" : "");
  const titles = {
    meta: "📊 Chotot Meta Ads — Creative Performance",
    google: "🔍 Chotot Google Ads — Campaign / Ad group",
    funnel: "↘ Chotot Ads — Google & Meta Funnel",
    campaign: "🎯 Chotot Campaign Reports — Awareness → Install",
  };
  document.getElementById("title").textContent = titles[p] || titles.meta;
  applyRange(curRange);
}

function applyRange(key) {
  if (platform === "google") { applyRangeGoogle(key); return; }
  if (platform === "funnel") { applyRangeFunnel(key); return; }
  if (platform === "campaign") { applyRangeCampaign(key); return; }
  curRange = key;
  applyAirbridge(key);
  const accounts = RANGES[key].accounts;
  DATA = {accounts};
  DATA.tabs = accounts.map(a => ({kind: "account", ...a}));
  activeIdx = Math.min(Math.max(activeIdx, 0), DATA.tabs.length - 1);
  document.getElementById("period").textContent = RANGES[key].period_label || "";
  document.getElementById("insights").style.display = "none";  // top summary removed; per-account insights only
  renderCards(); renderTabs(); renderControls(); renderPanel();
}

// CAMPAIGN view: the themed Brand-team campaigns (Thổ Địa, Back to School) that
// sync awareness -> app install, promoted to their own top-level section next to
// Meta / Google. Sub-tabs = the campaigns; cards summarize the selected campaign.
function renderCampaignCards() {
  // Sections mix Meta (spend in SGD) and Google (spend already in VND), so we
  // total everything in VND: Meta spend × rate + Google spend as-is.
  const tab = DATA.tabs[activeIdx];
  let spendVnd = 0, impr = 0, clk = 0, ins = 0, lead = 0, count = 0;
  if (tab && tab.sections) tab.sections.forEach(s => {
    if (s.platform === "demand") {
      // Demand (raw_retention): spend already in VND, lead-based. Installs are an
      // add-on secondary metric (Airbridge) — still roll into the Installs card.
      s.creatives.forEach(c => { spendVnd += c.spend; impr += c.impressions; clk += c.clicks; lead += (c.lead || 0); ins += (c.installs || 0); count++; });
    } else if (s.platform === "google") {
      s.creatives.forEach(c => { spendVnd += c.spend; impr += c.impressions; clk += c.clicks; ins += c.installs; count++; });
    } else {
      s.creatives.forEach(c0 => { const c = normalize(c0); spendVnd += (c.spend || 0) * SGD_TO_VND; impr += c.impressions; clk += c.clicks; ins += c.installs; count++; });
    }
  });
  const ctr = impr ? clk / impr * 100 : 0, cpi = ins ? spendVnd / ins : 0;
  const cards = [
    {k: "Total Spend", v: fmtVnd(spendVnd)},
    {k: "Impressions", v: fmtInt(impr)},
    {k: "Clicks", v: fmtInt(clk)},
    {k: "Avg CTR", v: fmtPct(ctr)},
    {k: AB ? "Installs · Airbridge" : "Installs", v: ins ? fmtInt(ins) : "–"},
    {k: "Avg CPI", v: cpi ? fmtVnd(cpi) : "–"},
    {k: "Leads · Demand", v: lead ? fmtInt(lead) : "–"},
    {k: "Creatives", v: fmtInt(count)},
  ];
  document.getElementById("cards").innerHTML = cards.map(c =>
    `<div class="card"><div class="k">${c.k}</div><div class="v ${c.accent ? "accent" : ""}">${c.v}</div></div>`
  ).join("");
}

function applyRangeCampaign(key) {
  curRange = key;
  applyAirbridge(key);
  const accounts = RANGES[key].accounts;
  DATA = {accounts, tabs: buildCampaignTabs(accounts)};
  activeIdx = Math.min(Math.max(activeIdx, 0), DATA.tabs.length - 1);
  document.getElementById("period").textContent = RANGES[key].period_label || "";
  document.getElementById("insights").style.display = "none";  // per-section insights suffice
  renderCampaignCards(); renderTabs(); renderControls(); renderPanel();
}

// Render the per-source freshness strip. Each source keeps its own "data
// through" date because they refresh on different cadences (Meta = weekly CI;
// the BigQuery/Sheet sources = manual pulls). Colour by how many days each is
// behind *today*, so a stale source is obvious before anyone compares it
// against a fresher one.
function renderFreshness(metaThrough) {
  const el = document.getElementById("freshness");
  if (!el) return;
  const today = new Date();
  const asDate = s => { const d = new Date((s || "").slice(0, 10) + "T00:00:00Z"); return isNaN(d) ? null : d; };
  const daysAgo = s => { const d = asDate(s); if (!d) return null; return Math.floor((today - d) / 86400000); };
  const cls = n => n == null ? "" : n <= 2 ? "fresh" : n <= 9 ? "watch" : "stale";
  const ago = n => n == null ? "?" : n <= 0 ? "hôm nay" : n === 1 ? "1 ngày" : n + " ngày";
  const items = [
    ["Meta creative", metaThrough],
    ["Airbridge installs", AB && AB.date_range ? AB.date_range[1] : null],
    ["Google Ads", GG ? GG.data_through : null],
    ["Demand", DEM ? DEM.data_through : null],
    ["Funnel (GG+Meta)", FNL ? FNL.data_through : null],
  ].filter(x => x[1]);
  el.innerHTML = `<span class="flabel">Data đến:</span>` + items.map(([name, through]) => {
    const n = daysAgo(through);
    const dstr = (through || "").slice(0, 10);
    return `<span class="fchip ${cls(n)}" title="${name} — data đến ${dstr}, trễ ${ago(n)} so với hôm nay">`
      + `<b>${name}</b><span class="fdate">${dstr}</span><span class="fago">${ago(n)}</span></span>`;
  }).join("");
}

Promise.all([
  fetch("./data/latest.json?v=" + Date.now()).then(r => r.json()),
  fetch("./data/airbridge_installs.json?v=" + Date.now()).then(r => r.ok ? r.json() : null).catch(() => null),
  fetch("./data/google_data.json?v=" + Date.now()).then(r => r.ok ? r.json() : null).catch(() => null),
  fetch("./data/demand_data.json?v=" + Date.now()).then(r => r.ok ? r.json() : null).catch(() => null),
  fetch("./data/google_funnel_data.json?v=" + Date.now()).then(r => r.ok ? r.json() : null).catch(() => null),
  fetch("./data/meta_funnel_data.json?v=" + Date.now()).then(r => r.ok ? r.json() : null).catch(() => null),
])
  .then(([d, ab, gg, dem, gfnl, mfnl]) => {
    RAW = d;
    AB = ab;
    GG = gg;
    DEM = dem;
    // Google and Meta funnel rows share one schema (see meta_funnel_build.py);
    // merge into a single FNL.rows so funnelWindow() treats both uniformly.
    FNL = (gfnl || mfnl) ? {
      data_through: [gfnl, mfnl].filter(Boolean).map(x => x.data_through).sort().pop(),
      rows: [...(gfnl ? gfnl.rows : []), ...(mfnl ? mfnl.rows : [])],
    } : null;
    if (DEM) console.log("Demand data loaded:", Object.keys(DEM.dims || {}).length, "campaigns,", Object.keys(DEM.by_day || {}).length, "days, through", DEM.data_through);
    if (AB) console.log("Airbridge installs loaded:", AB.date_range, Object.keys(AB.by_day || {}).length, "days");
    if (GG) console.log("Google data loaded:", GG.accounts, Object.keys(GG.by_day || {}).length, "days, through", GG.data_through);
    if (FNL) console.log("Funnel data loaded:", (FNL.rows || []).length, "rows (Google + Meta), through", FNL.data_through);
    // New schema has `ranges`; fall back to old flat schema for safety.
    RANGES = d.ranges || {all: {label: "", period_label: d.period_label, accounts: d.accounts}};
    const keys = Object.keys(RANGES);
    const sel = document.getElementById("range");
    sel.innerHTML = keys.map(k => `<option value="${k}">${RANGES[k].label || k}</option>`).join("");
    curRange = (d.default_range && RANGES[d.default_range]) ? d.default_range : keys[0];
    sel.value = curRange;
    sel.onchange = () => applyRange(sel.value);

    document.getElementById("generated").textContent = "Updated: " + (d.generated_at || "").replace("T", " ").replace("Z", " UTC");
    renderFreshness(d.generated_at);
    const abNote = AB ? "  ·  installs from Airbridge MMP (data through " + (AB.date_range ? AB.date_range[1] : "?") + ")" : "";
    document.getElementById("foot").textContent = "Freq badge:  <3× (ok) · 3–7× (watch) · ≥7× (high)  ·  Group by creative: reach is summed (estimate)  ·  VND @ 1 SGD = " + SGD_TO_VND.toLocaleString("en-US") + "  —  performance data from Meta Marketing API" + abNote;
    document.getElementById("btn-compare").onclick = () => setView("compare");
    document.getElementById("btn-creative").onclick = () => setView("creative");
    document.getElementById("btn-format").onclick = () => setView("format");
    document.getElementById("btn-perad").onclick = () => setView("ad");
    document.getElementById("btn-gg-compare").onclick = () => setSubView("compare");
    document.getElementById("btn-gg-detail").onclick = () => setSubView("detail");
    // (The campaign-name toggle is rendered inside each table header with an
    // inline onclick=toggleCampaign(), so no wiring is needed here.)

    // Top-level Meta / Google switch. Hide the Google button if no snapshot.
    document.getElementById("pf-meta").onclick = () => switchPlatform("meta");
    document.getElementById("pf-google").onclick = () => switchPlatform("google");
    document.getElementById("pf-funnel").onclick = () => switchPlatform("funnel");
    document.getElementById("pf-campaign").onclick = () => switchPlatform("campaign");
    document.getElementById("btn-fnl-all").onclick = () => setFnlChannel("ALL");
    document.getElementById("btn-fnl-google").onclick = () => setFnlChannel("GOOGLE");
    document.getElementById("btn-fnl-meta").onclick = () => setFnlChannel("META");
    if (!GG) document.getElementById("pf-google").style.display = "none";
    if (!FNL) document.getElementById("pf-funnel").style.display = "none";

    applyRange(curRange);
  })
  .catch(e => { document.getElementById("panel").innerHTML = `<div class="err">Failed to load data/latest.json<br>${e}</div>`; });
</script>
